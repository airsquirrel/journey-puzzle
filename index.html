  /* =========================================================
   * 14.5 导入他方行程：把其它智能体输出的行程文本解析成路线
   *      支持「HH:MM 地点」+ 缩进细节行 + Day 分段的常见格式
   * =======================================================*/
  var ITIN_TIME_RE = /^\s*(\d{1,2})\s*[:：]\s*(\d{2})\s*[、,，.。·\-—–:]?\s*(.+)$/;

  function parseMoney(str) {
    if (!str) return null;
    if (/免费/.test(str)) return 0;
    var m = /(\d+)\s*[-–~至]\s*(\d+)\s*元/.exec(str);
    if (m) return Math.round((+m[1] + +m[2]) / 2);
    var m2 = /(\d+)\s*元/.exec(str);
    return m2 ? +m2[1] : null;
  }

  function parseDwell(str) {
    if (!str) return null;
    var h = /(\d+(?:\.\d+)?)\s*[-–~至]\s*(\d+(?:\.\d+)?)\s*小时/.exec(str);
    if (h) return Math.round((+h[1] + +h[2]) / 2 * 60);
    var h2 = /(\d+(?:\.\d+)?)\s*小时/.exec(str);
    if (h2) return Math.round(+h2[1] * 60);
    var mi = /(\d+)\s*[-–~至]\s*(\d+)\s*分钟/.exec(str);
    if (mi) return Math.round((+mi[1] + +mi[2]) / 2);
    var mi2 = /(\d+)\s*分钟/.exec(str);
    if (mi2) return +mi2[1];
    return null;
  }

  function pickDetail(details, key) {
    var re = new RegExp('^\\s*' + key + '\\s*[:：]\\s*(.+)$');
    for (var i = 0; i < details.length; i++) {
      var m = re.exec(details[i]);
      if (m) return m[1].trim();
    }
    return '';
  }

  function itinQueryName(title) {
    var s = String(title || '').trim();
    s = s.replace(/^\s*(早餐|午餐|晚餐|夜宵|过早)\s*[-—–:：]\s*/, '');
    s = s.replace(/[（(][^）)]*[）)]/g, '');
    s = s.replace(/(出发|返程|回程|返回住宿|返回|夜游|过早|骑行|徒步|打卡|游览|参观|入住|住宿)$/, '');
    return s.trim() || String(title || '').trim();
  }

  function itinKind(title) {
    var t = String(title || '');
    if (/出发|起点/.test(t)) return 'depart';
    if (/返程|回程/.test(t) || /返回$/.test(t)) return 'return';
    if (/返回住宿|回住宿|回酒店|入住/.test(t)) return 'lodging';
    if (/住宿|酒店|青旅|旅舍|民宿/.test(t)) return 'lodging';
    if (/(早餐|午餐|晚餐|夜宵|过早|餐|小吃|水饺|牛杂|热干面|烧烤|咖啡|茶|面馆|食堂)/.test(t)) return 'food';
    return 'attraction';
  }

  // 这些字段不是交通描述，扫描车程时必须排除，否则「游玩时间：2-3小时」会被当成车程
  var ITIN_NONLEG = /^(游玩时间|门票|人均|推荐|招牌|口味|防坑|评分|价格|地址|亮点|重点看|玩法)\s*[:：]/;

  function hintsFromText(text) {
    text = String(text || '');
    if (!text) return null;
    if (!/地铁|公交|骑行|单车|打车|驾车|开车|自驾|轮渡|坐船|步行|车程/.test(text)) return null;
    var minutes = null;
    var m1 = /(?:车程|耗时|约)\s*(\d+)\s*分钟/.exec(text) || /(\d+)\s*分钟/.exec(text);
    if (m1) minutes = +m1[1];
    if (!minutes) {
      var m2 = /(\d+(?:\.\d+)?)\s*小时/.exec(text);
      if (m2) minutes = Math.round(+m2[1] * 60);
    }
    var mode = 'walking';
    if (/地铁/.test(text)) mode = 'subway';
    else if (/公交/.test(text)) mode = 'bus';
    else if (/骑行|单车/.test(text)) mode = 'bicycling';
    else if (/打车|驾车|开车|自驾/.test(text)) mode = 'driving';
    else if (/轮渡|坐船/.test(text)) mode = 'ferry';
    else if (/步行/.test(text)) mode = 'walking';
    return { mode: mode, minutes: minutes, approx: true, fromText: true };
  }

  // 到达方式可能写在上一站末尾（「车程约50分钟」），也可能写在本站的「交通：」行
  function parseLegHints(prevDetails, curDetails) {
    var explicit = pickDetail(curDetails || [], '交通');
    if (explicit) {
      var h = hintsFromText(explicit);
      if (h) return h;
    }
    var prev = (prevDetails || []).filter(function (l) {
      return !ITIN_NONLEG.test(l) && !/^交通\s*[:：]/.test(l);
    });
    return hintsFromText(prev.join(' '));
  }

  function parseItineraryText(text) {
    var lines = String(text || '').split(/\r?\n/);
    var stops = [];
    var from = '', to = '', budget = 0;
    var day = 1, cur = null, inAppendix = false, inLodging = false, lodgingName = '';

    function flush() { cur = null; }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/\s+$/, '');
      if (!line.trim()) continue;

      // 尾部纯文本附录与正文重复，直接跳过
      if (/【\s*备忘录/.test(line) || /【\s*预算明细/.test(line)) { inAppendix = true; continue; }
      if (inAppendix) continue;

      var mFrom = /出发地\s*[-—－]?\s*目的地\s*[:：]\s*(.+?)\s*(?:→|->|—>)\s*(.+)/.exec(line);
      if (mFrom) { from = mFrom[1].trim(); to = mFrom[2].trim(); continue; }

      var mCost = /(?:预估总花费|总花费|总预算)\s*[:：]\s*(.+)/.exec(line);
      if (mCost) { budget = parseMoney(mCost[1]) || 0; continue; }

      if (/【\s*住宿/.test(line)) { inLodging = true; continue; }
      if (inLodging) {
        if (/【/.test(line)) { inLodging = false; }
        else {
          var mL = /首选\s*[:：]\s*(.+)/.exec(line);
          if (mL) lodgingName = mL[1].trim();
          continue;
        }
      }

      var isHeader = /【/.test(line) || /^#{1,4}\s/.test(line) || /^[⏱📍🏨💡🎒📋💰📝🗺]/.test(line);
      if (isHeader) {
        var mDay = /Day\s*(\d+)/i.exec(line) || /第\s*(\d+)\s*天/.exec(line);
        if (mDay) { day = parseInt(mDay[1], 10) || day; flush(); }
        continue;
      }

      var mT = ITIN_TIME_RE.exec(line);
      if (mT) {
        flush();
        cur = {
          day: day,
          abs: (day - 1) * 1440 + (+mT[1]) * 60 + (+mT[2]),
          title: mT[3].trim(),
          details: []
        };
        stops.push(cur);
        continue;
      }
      if (cur) cur.details.push(line.trim());
    }

    if (lodgingName) {
      // 住宿单独成段，插到第一天末尾（第二天开始之前），而不是塞到返程前
      var insertAt = stops.length;
      var lodDay = stops.length ? stops[stops.length - 1].day : 1;
      for (var k = 0; k < stops.length; k++) {
        if (stops[k].day > 1) { insertAt = k; lodDay = stops[k].day - 1; break; }
      }
      stops.splice(insertAt, 0, {
        day: lodDay, abs: null, title: lodgingName, details: ['来源：住宿推荐']
      });
    }
    return { from: from, to: to, stops: stops, budget: budget };
  }

  /* --- 解析结果 → 内部节点模型 --- */
  function itineraryToPlan(parsed, geoList) {
    var stops = parsed.stops;
    var nodes = [];
    var seed = hashStr('itin|' + (parsed.from || '') + '|' + (parsed.to || '') + '|' + stops.length);
    var rng = mulberry32(seed);
    var ri = function (a, b) { return a + Math.floor(rng() * (b - a + 1)); };

    var cursor = null;
    var seenDepart = false;

    stops.forEach(function (s, i) {
      var kind = itinKind(s.title);
      var kindCode = kind;
      var baseKind = 'attraction';
      if (kind === 'depart') { baseKind = 'transport'; kindCode = 'transport-out'; }
      else if (kind === 'return') { baseKind = 'transport'; kindCode = 'transport-back'; }
      else if (kind === 'food') baseKind = 'food';
      else if (kind === 'lodging') baseKind = 'lodging';

      var meta = TYPE_META[baseKind];
      // 「返回住宿」只是回房放东西，不是过夜；只有当天最后一站才按整晚计算
      var isLastOfDay = (i === stops.length - 1) || (stops[i + 1].day !== s.day);
      var dwell = parseDwell(pickDetail(s.details, '游玩时间'));
      if (!dwell) {
        if (baseKind === 'lodging') dwell = isLastOfDay ? 480 : 25;
        else if (baseKind === 'transport') dwell = 40;
        else if (baseKind === 'food') dwell = 60;
        else dwell = 110;
      }
      var typeLabel = baseKind === 'lodging'
        ? (isLastOfDay ? '住宿' : '返回住宿')
        : meta.label;
      if (kindCode === 'transport-out') typeLabel = '去程交通';
      else if (kindCode === 'transport-back') typeLabel = '返程交通';

      var cost = parseMoney(pickDetail(s.details, '人均'));
      if (cost === null) cost = parseMoney(pickDetail(s.details, '门票'));
      if (cost === null) cost = parseMoney(pickDetail(s.details, '价格'));
      if (cost === null) cost = parseMoney(s.details.join(' '));
      if (cost === null) cost = 0;

      var start = s.abs;
      if (start === null || start === undefined) start = cursor === null ? 7 * 60 + 30 : cursor;
      if (cursor !== null && start < cursor) start = cursor;

      var notes = [];
      ['推荐', '招牌', '玩法', '口味'].forEach(function (k) {
        var v = pickDetail(s.details, k);
        if (v) notes.push(k + '：' + v);
      });
      var avoid = pickDetail(s.details, '防坑');
      var desc = notes.concat(s.details.filter(function (d) {
        return !/^(推荐|招牌|玩法|口味|防坑|门票|人均|游玩时间|交通|价格|评分|地址|亮点)\s*[:：]/.test(d);
      })).join('　');

      var geo = geoList[i] || null;
      var nd = {
        index: i, kind: baseKind, kindCode: kindCode,
        typeLabel: typeLabel,
        name: s.title, icon: meta.icon, color: meta.color, weight: WEIGHT[baseKind],
        lng: geo ? geo.lng : null, lat: geo ? geo.lat : null,
        cost: cost, start: start, duration: dwell,
        day: s.day, section: 'city',
        refCost: cost,
        real: geo ? { address: geo.address || '', rating: '', tel: '', note: notes.join('　') } : null,
        descBase: desc || '来自导入行程的站点。',
        tip: avoid ? ('防坑：' + avoid) : '来自导入行程，时间与费用以原文为准。'
      };
      nd.end = nd.start + nd.duration;
      nd.desc = nd.descBase;
      nd.legFromPrev = i > 0 ? parseLegHints(stops[i - 1].details, s.details) : null;

      var cCount = ri(1, 2), used = {};
      nd.comments = [];
      for (var c = 0; c < cCount; c++) {
        var cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
        var guard = 0;
        while (used[cname] && guard++ < 20) cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
        used[cname] = 1;
        nd.comments.push({
          name: cname, rating: ri(4, 5),
          text: COMMENT_TEXTS[ri(0, COMMENT_TEXTS.length - 1)],
          date: '2024-' + pad2(ri(1, 12)) + '-' + pad2(ri(1, 28))
        });
      }
      nodes.push(nd);
      cursor = nd.end;
    });

    // 没有经纬度的节点先剔除，保证地图能画
    var located = nodes.filter(function (n) { return isFinite(n.lng) && isFinite(n.lat); });
    located.forEach(function (n, i) { n.index = i; });

    var spent = located.reduce(function (s, n) { return s + n.cost; }, 0);
    var spanDays = 1;
    located.forEach(function (n) { if ((n.day || 1) > spanDays) spanDays = n.day || 1; });
    // 预算：优先用原文的「预估总花费」，否则按已花金额回推
    var budget = parsed.budget && parsed.budget > 0
      ? parsed.budget
      : Math.max(1, Math.round(spent / 0.88));

    return {
      from: parsed.from || '出发地',
      to: (parsed.to || '目的地').replace(/[（(].*?[）)]/g, ''),
      budget: budget, duration: spanDays * 24, seed: seed,
      nodes: located, legs: [],
      allocated: spent, ratio: budget ? spent / budget : 0, totalSpan: 0,
      source: 'amap', mode: 'imported', scenes: null, imported: true,
      meta: {
        imported: true,
        hub: (parsed.to || '目的地').replace(/[（(].*?[）)]/g, ''),
        days: spanDays,
        calDays: spanDays,
        nights: Math.max(0, spanDays - 1),
        dropped: nodes.length - located.length
      }
    };
  }

  // 定位一个地名：先在整个城市内搜（不锁到区，跨区的江汉大学也能搜到），
  // 再放开到全国，最后退回地理编码。
  function locateStop(name, area) {
    function tryPoi(city, citylimit) {
      return amapPoi({ keywords: name, citylimit: citylimit }, city, 1)
        .then(function (list) { return (list && list[0]) || null; })
        .catch(function () { return null; });
    }
    return tryPoi(area, true)
      .then(function (hit) { return hit || tryPoi('', false); })
      .then(function (hit) { return hit || amapGeo(name).catch(function () { return null; }); });
  }

  /* --- 解析 → 地理编码 → 取路径 → 渲染 --- */
  function buildPlanFromItinerary(text) {
    var parsed = parseItineraryText(text);
    if (!parsed.stops.length) { toast('没找到「HH:MM 地点」格式的行程行'); return Promise.reject(new Error('EMPTY')); }
    if (!amapKey()) { toast('解析地点需要高德 Key，请先填写'); return Promise.reject(new Error('NO_KEY')); }

    var cityHint = (parsed.to || '').replace(/[（(].*?[）)]/g, '').trim();
    // 高德个人 Key 的 QPS 很低，全部请求串行限速，所以这里会慢一些（约 0.4 秒/站）
    toast('正在定位 ' + parsed.stops.length + ' 个站点…（高德限速，约需 ' +
          Math.ceil(parsed.stops.length * 0.9 + 2) + ' 秒）');

    var resolveCity = cityHint ? amapGeo(cityHint).catch(function () { return null; }) : Promise.resolve(null);

    return resolveCity.then(function (city) {
      // 用「城市名」而不是「区级 adcode」做检索范围，否则跨区的地点（如江汉大学）搜不到
      var area = city ? (city.city || city.adcode || '') : cityHint;
      return mapLimit(parsed.stops, 3, function (s) {
        return locateStop(itinQueryName(s.title), area);
      }).then(function (geos) {
        var plan = itineraryToPlan(parsed, geos);
        if (!plan.nodes.length) { toast('所有站点都没能定位，请检查地点名称'); throw new Error('NO_GEO'); }

        // 定位整体失败时直接报错，不要画一张所有点重合的废图
        var uniq = {};
        plan.nodes.forEach(function (n) { uniq[r4(n.lng) + ',' + r4(n.lat)] = 1; });
        if (plan.nodes.length > 2 && Object.keys(uniq).length < 3) {
          throw new Error('LOW_CONFIDENCE');
        }

        // 用高德真实道路补全折线；耗时优先沿用原文
        var pairs = [];
        for (var i = 0; i < plan.nodes.length - 1; i++) pairs.push([plan.nodes[i], plan.nodes[i + 1]]);
        return mapLimit(pairs, 2, function (p, idx) {
          return amapLeg(p[0], p[1], area).then(function (leg) {
            var hint = plan.nodes[idx + 1].legFromPrev;
            if (hint && hint.fromText) {
              leg.mode = hint.mode || leg.mode;
              if (hint.minutes) leg.minutes = hint.minutes;
              leg.fromText = true;
            }
            return leg;
          });
        }).then(function (legs) {
          plan.legs = legs.map(function (l) { return l.polyline; });
          plan.nodes.forEach(function (nd, i) {
            if (i > 0) nd.legFromPrev = legs[i - 1];
          });
          var last = plan.nodes[plan.nodes.length - 1];
          plan.totalSpan = last.end - plan.nodes[0].start;
          return plan;
        });
      });
    });
  }

  /* --- 弹窗：两段式（粘贴 → 预览 → 生成） --- */
  function showItineraryModal() {
    overlayEl.innerHTML =
      '<div class="modal">' +
        '<h3>导入分享路线</h3>' +
        '<p>把行程文本整段粘进来（例如其它 AI 生成的攻略）。识别规则：行首「HH:MM 地点」为站点，随后的缩进行作为该站细节（推荐／门票／人均／游玩时间／防坑），<code>Day1/Day2</code> 自动分天。</p>' +
        '<p style="color:var(--faint)">也可以直接粘 `#r=` 分享链接。</p>' +
        '<textarea id="itinInput" rows="8" placeholder="07:00 江汉大学出发&#10;地铁3号线…车程约50分钟&#10;08:00 粮豆街过早&#10;推荐：丽华早点店"></textarea>' +
        '<div class="modal-actions">' +
          '<button class="mini-btn" data-close="1" type="button">取消</button>' +
          '<button class="mini-btn primary" data-parse="1" type="button">解析并生成</button>' +
        '</div>' +
      '</div>';
    overlayEl.hidden = false;
    var inp = document.getElementById('itinInput');
    if (inp) inp.focus();
  }

  function runItineraryImport(text) {
    // 如果粘进来的是分享链接，直接走链接解码，省得用户再找入口
    if (extractPayload(text)) { doImport(text); return; }
    var btn = overlayEl.querySelector ? overlayEl.querySelector('[data-parse]') : null;
    if (btn) { btn.disabled = true; btn.textContent = '解析中…'; }
    function restore() {
      if (btn) { btn.disabled = false; btn.textContent = '解析并生成'; }
    }
    buildPlanFromItinerary(text).then(function (plan) {
      restore();
      closeOverlay();
      var synced = renderItineraryPlan(plan);
      toast('已生成：' + plan.from + ' → ' + plan.to + ' · ' + plan.nodes.length + ' 站' +
            (plan.meta.dropped ? '（' + plan.meta.dropped + ' 站未能定位已跳过）' : '') +
            syncToastText(synced));
    }).catch(function (e) {
      restore();
      if (!e || !e.message) return;
      if (e.message === 'NO_KEY' || e.message === 'EMPTY') return;
      if (e.message === 'LOW_CONFIDENCE') {
        toast('地点定位失败：多数站点落在同一位置。高德 Key 可能触发限流或额度不足，请稍后重试');
        return;
      }
      console.error('[itinerary]', e);
      toast('导入失败：' + (e.message === 'NO_GEO' ? '站点未能定位' : '请检查行程文本'));
    });
  }

  function renderItineraryPlan(plan) {
    // 把出发地 / 目的地回填到控制面板，避免面板和地图显示两套地名
    if (plan.from) { originEl.value = plan.from; pickedPlace.origin = null; }
    if (plan.to) { destEl.value = plan.to; pickedPlace.dest = null; }
    var synced = syncControlsFromPlan(plan);
    renderPlan(plan, 'itin_' + plan.seed);
    return synced;
  }

  /* =========================================================
   * 15. 分享链接落地
   *     #r=<内嵌路线数据> 优先，跨设备可用；#share/<id> 兼容旧的本地分享
   * =======================================================*/
  function handleHash() {
    var hash = location.hash || '';
    var mInline = /^#r=(.+)$/.exec(hash);
    if (mInline) {
      try {
        var plan = decodePlan(mInline[1]);
        renderPlan(plan, 'imp_' + plan.seed);
        toast('已导入分享路线：' + plan.from + ' → ' + plan.to + ' · ' + plan.nodes.length + ' 站');
        return true;
      } catch (e) {
        console.error('[import]', e);
        toast('分享链接已损坏或版本不兼容');
        return false;
      }
    }
    var m = /^#share\/(.+)$/.exec(hash);
    if (!m) return false;
    var id = decodeURIComponent(m[1]);
    var all = store.routes.concat(store.community);
    var r = all.filter(function (x) { return x.id === id; })[0];
    if (r) {
      loadRoute(clonePlan(r.plan), r.id, '已通过分享链接载入路线');
      return true;
    }
    toast('未找到该分享路线（旧格式链接只能在保存它的浏览器里打开）');
    return false;
  }
  window.addEventListener('hashchange', function () { handleHash(); });

  /* =========================================================
   * 16. 启动
   * =======================================================*/
  document.getElementById('saveRoute').addEventListener('click', saveCurrentRoute);
  document.getElementById('shareCurrent').addEventListener('click', function () {
    if (!state.plan) { toast('先生成一条路线再分享'); return; }
    doShare(state.plan, state.plan.from, state.plan.to);
  });
  document.getElementById('importItinerary').addEventListener('click', showItineraryModal);

  /* =========================================================
   * 8.5 出发地 / 目的地 模糊搜索联想
   * =======================================================*/
  var tipPairs = [
    { key: 'origin', input: document.getElementById('origin'), list: document.getElementById('originTips') },
    { key: 'dest',   input: document.getElementById('dest'),   list: document.getElementById('destTips') }
  ];
  var tipState = {};

  // 用另一端已选中的「省 / 市 / 坐标」做偏置，从而同名地点优先本地、其次省内
  function provinceOf(district) {
    var s = String(district || '');
    var m = /^(.{2,10}?(?:省|自治区|特别行政区))/.exec(s);
    if (m) return m[1];
    var m2 = /^(北京市|上海市|天津市|重庆市)/.exec(s);
    return m2 ? m2[1] : '';
  }

  function biasInfo(exceptKey) {
    var city = '', province = '', lng = NaN, lat = NaN;
    for (var i = 0; i < tipPairs.length; i++) {
      var k = tipPairs[i].key;
      if (k === exceptKey) continue;
      var p = pickedPlace[k];
      if (p) {
        city = p.city || city;
        province = provinceOf(p.district) || province;
        if (isFinite(p.lng)) { lng = p.lng; lat = p.lat; }
      }
      if (!city) {
        var txt = tipPairs[i].input.value.trim();
        if (txt.length >= 2) city = txt;
      }
    }
    if (!province && city) province = provinceOf(city);
    return { city: city, province: province, lng: lng, lat: lat };
  }

  function closeTips(pair) {
    pair.list.hidden = true;
    pair.list.innerHTML = '';
    tipState[pair.key] = null;
  }

  function renderTips(pair, items, bias) {
    if (!items.length) {
      pair.list.innerHTML = '<div class="tip-empty">没有匹配的地点</div>';
      pair.list.hidden = false;
      tipState[pair.key] = { items: [], index: -1 };
      return;
    }
    var bp = bias ? bias.province : '', bc = bias ? bias.city : '';
    pair.list.innerHTML = items.map(function (t, i) {
      var sameCity = bc && t.district && t.district.indexOf(bc) >= 0;
      var sameProv = bp && provinceOf(t.district) === bp;
      var tag = sameCity ? '本地 · ' : (sameProv ? '省内 · ' : '');
      var dist = t.district || t.address || '';
      return '<div class="tip-item" data-i="' + i + '">' +
               '<span class="t-name">' + esc(t.name) + '</span>' +
               '<span class="t-dist' + (tag ? ' t-same' : '') + '">' +
                 tag + esc(dist) + '</span>' +
             '</div>';
    }).join('');
    pair.list.hidden = false;
    tipState[pair.key] = { items: items, index: -1 };
  }

  function pickTip(pair, tip) {
    pair.input.value = tip.name;
    pickedPlace[pair.key] = tip;
    closeTips(pair);
    toast('已选择：' + tip.name + (tip.district ? '（' + tip.district + '）' : ''));
  }

  function moveTipSelection(pair, delta) {
    var st = tipState[pair.key];
    if (!st || !st.items.length) return;
    st.index = (st.index + delta + st.items.length) % st.items.length;
    Array.prototype.forEach.call(pair.list.querySelectorAll('.tip-item'), function (el2, i) {
      el2.classList.toggle('on', i === st.index);
    });
    var cur = pair.list.querySelectorAll('.tip-item')[st.index];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }

  tipPairs.forEach(function (pair) {
    var timer = null;

    pair.input.addEventListener('input', function () {
      var q = pair.input.value.trim();
      // 手动改动文字后，之前选中的候选点失效
      if (!pickedPlace[pair.key] || pickedPlace[pair.key].name !== q) pickedPlace[pair.key] = null;
      if (timer) window.clearTimeout(timer);
      if (q.length < 2) { closeTips(pair); return; }
      if (!amapKey()) {
        pair.list.innerHTML = '<div class="tip-empty">填写高德 Web 服务 Key 后可搜索地点</div>';
        pair.list.hidden = false;
        tipState[pair.key] = { items: [], index: -1 };
        return;
      }
      timer = window.setTimeout(function () {
        var bias = biasInfo(pair.key);
        amapTips(q, bias.city).then(function (items) {
          // 排序：完全同名压倒一切；同质量再看是否省内 → 同城 → 距离更近。
          // 这样输入「长沙」时城市本身仍然第一，而输入「南站」时省内那个排前面。
          function score(t) {
            var s = 0;
            if (t.name === q) s += 1000;
            else if (t.name.indexOf(q) === 0) s += 220;
            else if (t.name.indexOf(q) >= 0) s += 90;
            var tp = provinceOf(t.district);
            if (bias.province && tp && tp === bias.province) s += 120;
            if (bias.city && t.district && t.district.indexOf(bias.city) >= 0) s += 50;
            if (isFinite(bias.lng) && isFinite(t.lng)) {
              s += Math.max(0, 30 - haversineKm({ lng: bias.lng, lat: bias.lat }, t) / 30);
            }
            if (isFinite(t.lng) && isFinite(t.lat)) s += 5;
            return s;
          }
          items.forEach(function (t, i) { t._i = i; t._s = score(t); });
          items.sort(function (a, b) { return b._s - a._s || a._i - b._i; });
          renderTips(pair, items.slice(0, 12), bias);
        }).catch(function (e) {
          if (String(e && e.message) === 'NO_KEY') return;
          pair.list.innerHTML = '<div class="tip-empty">' + esc(amapErrorText(e)) + '</div>';
          pair.list.hidden = false;
        });
      }, 260);
    });

    pair.input.addEventListener('keydown', function (ev) {
      var st = tipState[pair.key];
      if (ev.key === 'ArrowDown') { ev.preventDefault(); moveTipSelection(pair, 1); return; }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); moveTipSelection(pair, -1); return; }
      if (ev.key === 'Escape') { closeTips(pair); return; }
      if (ev.key === 'Enter') {
        if (st && st.index >= 0 && st.items[st.index]) {
          ev.preventDefault();
          pickTip(pair, st.items[st.index]);
          return;
        }
        document.getElementById('generate').click();
      }
    });

    pair.list.addEventListener('click', function (ev) {
      var item = ev.target.closest('.tip-item');
      if (!item) return;
      var st = tipState[pair.key];
      var tip = st && st.items[+item.getAttribute('data-i')];
      if (tip) pickTip(pair, tip);
    });

    pair.input.addEventListener('blur', function () {
      window.setTimeout(function () { closeTips(pair); }, 160);
    });
    pair.input.addEventListener('focus', function () {
      var st = tipState[pair.key];
      if (st && st.items.length) pair.list.hidden = false;
    });
  });

  // 首次运行预置社区路线
  seedCommunity();

  // 若地址栏带分享 ID 则直接载入，否则渲染默认路线
  if (!handleHash()) {
    renderPlan(buildMockPlan({
      from: originEl.value,
      to: destEl.value,
      budget: +budgetEl.value,
      duration: duration
    }));
  }
})();
</script>
</body>
</html>
