<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅程拼图 · 路线规划器</title>
<meta name="description" content="输入出发地、目的地、预算与时长，一键拼出一条可执行的行程：地图、时间轴、预算分配、他人行程导入，全部在单个网页内完成。">
<meta name="theme-color" content="#3b82f6">
<meta property="og:type" content="website">
<meta property="og:title" content="旅程拼图 · 路线规划器">
<meta property="og:description" content="一键把出发地、预算、时长拼成可执行行程：真实路网、可拖拽时间轴、预算分配、支持导入其它 AI 生成的行程文本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M8 20l5-9 5 6 3-4 3 7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --border:#e2e8f0;
    --primary:#3b82f6;
    --primary-dark:#2563eb;
    --accent:#f97316;
    --text:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --radius:6px;
    --c-transport:#3b82f6;
    --c-attraction:#22c55e;
    --c-food:#f59e0b;
    --c-lodging:#8b5cf6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
    font-size:14px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 顶栏 ---------- */
  .topbar{
    max-width:1560px;margin:0 auto;padding:20px 20px 4px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  .topbar h1{
    margin:0;font-size:18px;font-weight:650;letter-spacing:.6px;
    display:flex;align-items:center;gap:8px;
  }
  .topbar h1 .mark{
    width:10px;height:18px;border-radius:2px;background:var(--primary);
    box-shadow:6px 0 0 -3px var(--accent);display:inline-block;
  }
  .topbar .sub{color:var(--faint);font-size:12.5px;letter-spacing:.2px;}
  /* ---------- 布局 ---------- */
  .layout{
    max-width:1560px;margin:0 auto;padding:12px 20px 0;
    display:grid;grid-template-columns:290px minmax(0,1fr) 344px;
    gap:14px;align-items:start;
  }
  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.05);
    overflow:hidden;
  }
  .panel-head{
    padding:11px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;font-weight:650;letter-spacing:.4px;color:#334155;
  }
  .panel-head .meta{font-weight:500;color:var(--faint);font-size:11.5px;letter-spacing:0;}
  .map-head-right{display:flex;align-items:center;gap:10px;min-width:0;}
  .seg.mini{border-radius:5px;flex:0 0 auto;}
  .seg.mini button{padding:3px 10px;font-size:11px;line-height:1.5;}
  .seg.mini[hidden]{display:none;}
  .panel-body{padding:14px;}
  /* ---------- 表单 ---------- */
  .field{margin-bottom:15px;}
  .field > label{
    display:block;font-size:12px;font-weight:600;color:#475569;
    margin-bottom:6px;letter-spacing:.3px;
  }
  input[type=text]{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);
    font:inherit;font-size:13.5px;color:var(--text);background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.13);
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--radius);
    background:linear-gradient(to right,#3b82f6 0%,#3b82f6 var(--p,44%),#e5e7eb var(--p,44%),#e5e7eb 100%);
    outline:none;margin:8px 0 2px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--primary);cursor:pointer;
    box-shadow:0 1px 3px rgba(15,23,42,.22);transition:transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.14);}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--primary);
    cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.22);
  }
  .range-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);}
  /* ---------- 输入联想 ---------- */
  .tip-field{position:relative;}
  .tip-list{
    position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:3px;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 10px 24px rgba(15,23,42,.14);max-height:236px;overflow-y:auto;
  }
  .tip-list[hidden]{display:none;}
  .tip-item{
    padding:7px 10px;cursor:pointer;font-size:12.5px;display:flex;
    justify-content:space-between;gap:10px;align-items:baseline;
    border-bottom:1px solid #f1f5f9;
  }
  .tip-item:last-child{border-bottom:0;}
  .tip-item:hover,.tip-item.on{background:#eff6ff;}
  .tip-item .t-name{
    font-weight:600;color:#0f172a;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tip-item .t-dist{flex:0 0 auto;font-size:10.5px;color:var(--faint);max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tip-item .t-same{color:var(--primary);font-weight:700;}
  .tip-empty{padding:9px 10px;font-size:12px;color:var(--faint);}
  .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#f8fafc;}
  .seg button{
    flex:1;padding:8px 0;border:0;border-right:1px solid var(--border);
    background:transparent;font:inherit;font-size:13px;color:#475569;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .seg button:last-child{border-right:0;}
  .seg button:hover{background:#eef2f7;}
  .seg button.active{background:var(--primary);color:#fff;font-weight:600;}
  .seg button.active:hover{background:var(--primary-dark);}
  .btn{
    display:block;width:100%;padding:11px 14px;border:0;border-radius:var(--radius);
    background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:600;
    letter-spacing:.5px;cursor:pointer;transition:background .15s, transform .08s;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:translateY(1px);}
  /* ---------- 预算条 ---------- */
  .budget{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);}
  .budget-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#475569;font-weight:600;margin-bottom:8px;}
  .budget-head .amt{color:var(--text);font-variant-numeric:tabular-nums;font-size:13px;}
  .bar{height:8px;background:#e5e7eb;border-radius:var(--radius);overflow:hidden;}
  .bar-fill{
    height:100%;width:0;background:#94a3b8;border-radius:var(--radius);
    transition:width .55s cubic-bezier(.4,0,.2,1), background .3s;
  }
  .bar-fill.warn{background:var(--accent);}
  .budget-note{margin-top:7px;font-size:11.5px;color:var(--faint);}
  .budget-note.warn{color:var(--accent);font-weight:600;}
  /* ---------- 地图 ---------- */
  .map-wrap{position:relative;background:#f8f9fa;overflow:hidden;}
  svg#map{display:block;width:100%;height:auto;cursor:grab;touch-action:none;}
  svg#map.dragging{cursor:grabbing;}
  /* 两种地图互斥显示：用 data-mode 控制，不依赖 hidden 属性。
     注意 <svg> 不是 HTMLElement，没有 hidden 这个 IDL 属性，
     直接写 svg.hidden = true 只会挂一个无效的 JS 属性上去。 */
  .map-wrap[data-mode="tile"] > svg#map{display:none;}
  .map-wrap[data-mode="svg"] > .tile-map{display:none;}
  .panel-foot{
    padding:8px 14px;border-top:1px solid var(--border);background:#fbfcfe;
    font-size:11.5px;color:var(--muted);line-height:1.6;
  }
  .panel-foot b{color:#334155;font-weight:600;}
  .tl-day{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:11px;font-weight:700;color:var(--faint);letter-spacing:2px;
    padding:0 3px;border-right:1px dashed var(--border);
  }
  .tl-section{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:11.5px;font-weight:700;color:var(--primary);letter-spacing:3px;
    padding:0 7px;margin-right:5px;background:#eff6ff;border-radius:5px;
  }
  .legend{
    position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);
    border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    box-shadow:0 1px 3px rgba(15,23,42,.06);backdrop-filter:blur(2px);
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  /* 图例字号分级：景点/餐饮/住宿 > 交通方式 > 医疗 */
  .legend .lg{font-weight:700;color:#0f172a;border-radius:4px;padding:1px 7px;line-height:1.6;}
  .legend .lg-hot{background:#fde047;font-size:12px;}
  .legend .lg-transport{background:#93c5fd;font-size:11px;}
  .legend .lg-medical{background:#fca5a5;font-size:10.5px;}
  .legend .lg i{width:7px;height:7px;}
  /* SVG 元素 */
  .node{cursor:pointer;}
  .node .dot,.node .halo{transition:transform .18s ease,opacity .18s ease;transform-box:fill-box;transform-origin:center;}

  /* 节点抽稀：过密的次要节点缩小并隐藏标签；悬停或选中即恢复。
     这几条必须排在 :hover / .active 之前，同优先级下后者才能覆盖。 */
  .node.minor .dot{transform:scale(.66);opacity:.62;}
  .node.minor .halo{opacity:.1;transform:scale(.7);}
  .node.minor .node-badge,.node.minor .node-label{opacity:0;}
  .node:hover .dot{transform:scale(1.3);opacity:1;}
  .node:hover .halo{transform:scale(1.55);opacity:.4;}
  .node:hover .node-badge,.node:hover .node-label{opacity:1;}
  .node.active .dot{transform:scale(1.32);opacity:1;}
  .node.active .node-badge,.node.active .node-label{opacity:1;}

  .node .ring{opacity:0;transform-box:fill-box;transform-origin:center;}
  .node.active .ring{opacity:.9;animation:spin 9s linear infinite;}
  .node:focus{outline:none;}
  .node:focus-visible .dot{stroke:#0f172a;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 地点标签分级：景点/餐饮/住宿（黄底黑字）> 交通（蓝底黑字）> 底图注记（已由 ltype 剥离） */
  .node-badge{stroke:rgba(15,23,42,.18);stroke-width:.5;pointer-events:none;transition:opacity .18s;}
  .node-badge.lb-hot{fill:#fde047;}
  .node-badge.lb-transport{fill:#93c5fd;}
  .node-badge.lb-medical{fill:#fca5a5;}
  .node-label{
    font-size:11px;font-weight:650;fill:#0f172a;pointer-events:none;transition:opacity .18s;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }

  /* 路线：发光实线 + 流光动画 */
  .route-flow{animation:flowDash 2.2s linear infinite;}
  @keyframes flowDash{from{stroke-dashoffset:0;}to{stroke-dashoffset:-112;}}

  /* 路段中点：方向箭头 + 交通方式与耗时 */
  .leg-arrow{fill:#1d4ed8;stroke:#ffffff;stroke-width:1;stroke-linejoin:round;}
  .leg-label{
    font-size:10.5px;font-weight:650;fill:#1e40af;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  /* ---------- 详情面板 ---------- */
  .detail-body{padding:14px;min-height:240px;}
  .detail-empty{color:var(--faint);font-size:13px;text-align:center;padding:56px 12px;line-height:1.9;}
  .detail-empty .big{display:block;font-size:26px;margin-bottom:8px;opacity:.55;}
  .detail-card{animation:fadeUp .3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  .dc-top{display:flex;gap:11px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .dc-icon{
    width:44px;height:44px;flex:0 0 44px;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;font-size:21px;
    border:1px solid var(--border);
  }
  .dc-title{min-width:0;}
  .dc-type{font-size:11px;font-weight:600;letter-spacing:.6px;padding:1px 7px;border-radius:3px;display:inline-block;margin-bottom:3px;}
  .dc-name{font-size:15px;font-weight:650;line-height:1.35;word-break:break-word;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0;}
  .meta-item{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;}
  .meta-item b{display:block;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.5px;}
  .meta-item span{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;}
  .sec-title{font-size:11.5px;font-weight:650;color:#475569;letter-spacing:.6px;margin:14px 0 6px;display:flex;align-items:center;gap:6px;}
  .sec-title::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--primary);display:inline-block;}
  .dc-desc{font-size:13px;color:#334155;}
  .tip-box{
    background:#fff7ed;border:1px solid #fed7aa;border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:9px 11px;font-size:12.5px;color:#7c2d12;
  }
  .real-box{
    background:#f0f7ff;border:1px solid #bfdbfe;border-left:3px solid var(--primary);
    border-radius:var(--radius);padding:9px 11px;font-size:12.5px;color:#1e3a8a;
    display:flex;flex-direction:column;gap:4px;word-break:break-word;
  }
  .comment{border-top:1px solid var(--border);padding:9px 0 3px;display:flex;gap:9px;}
  .avatar{
    width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#e2e8f0;color:#475569;
    font-size:11px;font-weight:650;display:flex;align-items:center;justify-content:center;
  }
  .cm-body{min-width:0;flex:1;}
  .cm-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .cm-name{font-size:12px;font-weight:650;color:#334155;}
  .cm-stars{font-size:10.5px;color:var(--accent);letter-spacing:1px;}
  .cm-text{font-size:12.5px;color:#475569;}
  .cm-date{font-size:10.5px;color:var(--faint);}
  /* ---------- 时间轴 ---------- */
  .timeline-wrap{max-width:1560px;margin:10px auto 0;padding:0 20px 22px;}
  /* 时间轴面板：上下留白收紧，让标题贴近卡片 */
  .timeline-wrap .panel-head{padding:8px 14px;}
  .tl-body{padding:6px 12px 4px;}
  .timeline{
    display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-behavior:smooth;
    align-items:stretch;min-height:0;
  }
  /* 滚动行里的子项绝不能被压缩：否则长文本会逐字换行，把整行撑得极高 */
  .timeline > *{flex:0 0 auto;}
  .timeline::-webkit-scrollbar{height:8px;}
  .timeline::-webkit-scrollbar-track{background:#eef1f5;border-radius:6px;}
  .timeline::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;}
  .timeline::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
  .tl-card{
    flex:0 0 auto;width:176px;background:#fff;border:1px solid var(--border);
    border-left:4px solid #cbd5e1;border-radius:var(--radius);padding:9px 11px;
    cursor:pointer;text-align:left;font:inherit;color:inherit;
    transition:transform .16s, box-shadow .16s, border-color .16s;
  }
  .tl-card:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(15,23,42,.09);}
  .tl-card:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.2);}
  .tl-card.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.14);transform:translateY(-2px);}
  .tl-time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .tl-name{font-size:12.5px;font-weight:600;margin:3px 0 5px;line-height:1.4;word-break:break-word;}
  .tl-cost{font-size:12.5px;font-weight:650;color:#334155;font-variant-numeric:tabular-nums;}
  .tl-card.active .tl-cost{color:var(--primary);}
  .tl-stay{font-size:10px;color:var(--faint);margin-top:1px;}
  .modal textarea{
    width:100%;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;word-break:break-all;
  }
  /* ---------- 真实瓦片地图 ---------- */
  .tile-map{
    position:relative;width:100%;aspect-ratio:900 / 620;min-height:340px;
    overflow:hidden;background:#e9edf1;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  .tile-map[hidden]{display:none;}
  .tile-map.dragging{cursor:grabbing;}
  .tile-layer{
    position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
    /* 背景虚化：底图退成低饱和的浅背景，路线与节点才是主角 */
    filter:saturate(.42) contrast(.94) brightness(1.06) blur(.4px);
    opacity:.6;
  }
  .tile-layer img{
    position:absolute;width:256px;height:256px;display:block;border:0;
    pointer-events:none;-webkit-user-drag:none;
  }
  .tile-overlay{position:absolute;left:0;top:0;pointer-events:none;}
  .tile-overlay .node{pointer-events:auto;}

  /* ---------- 地图工具 / 比例尺 / 提示 ---------- */
  .map-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5;}
  .map-tools button{
    width:32px;height:32px;border:1px solid var(--border);background:rgba(255,255,255,.95);
    border-radius:var(--radius);font:inherit;font-size:16px;line-height:1;color:#334155;
    cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.14);
    transition:background .15s,border-color .15s;
  }
  .map-tools button:hover{background:#fff;border-color:#94a3b8;}
  .map-tools button:active{transform:translateY(1px);}
  .map-hint{
    position:absolute;left:12px;top:12px;z-index:5;pointer-events:none;
    font-size:11px;color:#475569;background:rgba(255,255,255,.9);
    border:1px solid var(--border);border-radius:var(--radius);padding:3px 8px;
  }
  /* 驻点漫游下的城际 / 市内视图切换 */
  .map-scenes{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;
    display:flex;background:rgba(255,255,255,.95);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(15,23,42,.14);
  }
  .map-scenes[hidden]{display:none;}
  .map-scenes button{
    border:0;border-right:1px solid var(--border);background:transparent;
    font:inherit;font-size:11.5px;color:#475569;padding:5px 12px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .map-scenes button:last-child{border-right:0;}
  .map-scenes button:hover{background:#eef2f7;}
  .map-scenes button.active{background:var(--primary);color:#fff;font-weight:600;}
  .scale-bar{
    position:absolute;right:12px;bottom:12px;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10.5px;color:#334155;text-shadow:0 0 3px #fff,0 0 3px #fff;
  }
  .scale-bar[hidden]{display:none;}
  .scale-bar i{display:block;height:6px;border:1px solid #334155;border-top:0;background:rgba(255,255,255,.55);}

  /* ---------- 评论 / 路线库 ---------- */
  .cs-wrap{max-width:1560px;margin:14px auto 0;padding:0 20px 34px;}
  .cs-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start;}
  .cs-col{display:flex;flex-direction:column;gap:14px;}
  .list-body{padding:12px;max-height:430px;overflow-y:auto;}
  .cm-list{max-height:460px;overflow-y:auto;padding-right:4px;}
  .list-body::-webkit-scrollbar,.cm-list::-webkit-scrollbar{width:8px;}
  .list-body::-webkit-scrollbar-track,.cm-list::-webkit-scrollbar-track{background:#eef1f5;border-radius:6px;}
  .list-body::-webkit-scrollbar-thumb,.cm-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;}
  .list-body::-webkit-scrollbar-thumb:hover,.cm-list::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
  .empty-tip{color:var(--faint);font-size:12.5px;text-align:center;padding:26px 8px;line-height:1.9;}
  .btn.dark{background:#334155;margin-top:9px;font-size:13px;padding:9px 14px;}
  .btn.dark:hover{background:#1e293b;}

  /* 评论表单 */
  .cm-form{border:1px solid var(--border);border-radius:var(--radius);padding:11px;background:#fbfcfe;margin-bottom:6px;}
  .cm-form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .cm-form-row input[type=text]{flex:1;min-width:0;}
  .file-btn{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;
    font-size:12.5px;color:#334155;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);padding:7px 11px;transition:background .15s,border-color .15s;
  }
  .file-btn:hover{background:#eef2f7;border-color:#cbd5e1;}
  textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);
    font:inherit;font-size:13.5px;color:var(--text);background:#fff;resize:vertical;min-height:66px;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.13);}
  .cm-preview{display:flex;align-items:center;gap:10px;margin-top:9px;}
  .cm-preview[hidden]{display:none;}
  .cm-preview img{width:76px;height:76px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);}
  .cm-form-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
  .cm-form-actions .hint{font-size:11px;color:var(--faint);}
  .btn.small{width:auto;padding:7px 18px;font-size:13px;}

  /* ---------- 时间轴：可拖拽重排 + 段间交通信息 ---------- */
  .tl-hint{font-size:11px;color:var(--faint);margin-bottom:6px;}
  .tl-group{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    cursor:grab;touch-action:none;border-radius:var(--radius);
    transition:opacity .15s,box-shadow .15s;
  }
  .tl-group.dragging{opacity:.55;cursor:grabbing;box-shadow:0 6px 18px rgba(59,130,246,.3);}
  /* 两段式布局里「路线导航」的城际两端位置固定，不可拖动 */
  .tl-group[data-section="inter"]{cursor:default;}
  .tl-group[data-section="inter"]:hover{border-color:var(--border);box-shadow:none;}
  .timeline.reordering .tl-day,.timeline.reordering .tl-section{opacity:.3;}
  .tl-leg{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    width:78px;color:var(--faint);font-size:10px;
  }
  .tl-leg-arrow{font-size:12px;color:#cbd5e1;line-height:1;}
  .tl-leg-lbl{
    background:#eff6ff;color:#1e40af;border-radius:3px;padding:1px 6px;
    font-weight:650;font-size:10px;white-space:nowrap;
  }
  .tl-leg-km{font-size:9.5px;color:var(--faint);white-space:nowrap;}
  .tl-sum{
    font-size:11px;color:var(--muted);background:#f8fafc;border:1px solid var(--border);
    border-radius:var(--radius);padding:5px 10px;margin:4px 2px 2px;line-height:1.65;
    display:block;width:auto;
  }
  .tl-sum:empty{display:none;}
  .tl-sum b{color:#334155;font-weight:650;}

  /* 评论条目 */
  .cm-item{display:flex;gap:10px;padding:11px 2px;border-top:1px solid var(--border);}
  .cm-item:first-child{border-top:0;}
  .cm-item .avatar{width:32px;height:32px;flex:0 0 32px;font-size:12px;}
  .cm-main{flex:1;min-width:0;}
  .cm-row{display:flex;align-items:baseline;gap:8px;}
  .cm-user{font-size:12.5px;font-weight:650;color:#334155;}
  .cm-time{font-size:10.5px;color:var(--faint);}
  .cm-del{
    margin-left:auto;border:0;background:transparent;color:var(--faint);cursor:pointer;
    font:inherit;font-size:11px;padding:2px 5px;border-radius:3px;transition:color .15s,background .15s;
  }
  .cm-del:hover{color:var(--accent);background:#fff7ed;}
  .cm-content{font-size:13px;color:#334155;white-space:pre-wrap;word-break:break-word;margin-top:2px;}
  .cm-thumb{
    margin-top:8px;max-width:200px;max-height:160px;border-radius:var(--radius);
    border:1px solid var(--border);cursor:zoom-in;display:block;object-fit:cover;
  }

  /* 路线卡片 */
  .rt-card{
    border:1px solid var(--border);border-radius:var(--radius);padding:10px 11px;background:#fff;
    transition:box-shadow .16s,border-color .16s;
  }
  .rt-card + .rt-card{margin-top:9px;}
  .rt-card:hover{box-shadow:0 4px 12px rgba(15,23,42,.08);border-color:#cbd5e1;}
  .rt-card.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .rt-head{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .rt-author{display:flex;align-items:center;gap:7px;min-width:0;}
  .rt-author .avatar{width:22px;height:22px;flex:0 0 22px;font-size:10.5px;}
  .rt-route{font-size:13.5px;font-weight:650;letter-spacing:.2px;min-width:0;word-break:break-word;}
  .rt-route .arrow{color:var(--primary);margin:0 4px;}
  .rt-badge{flex:0 0 auto;font-size:10.5px;font-weight:650;color:#475569;background:#f1f5f9;border-radius:3px;padding:1px 6px;}
  .rt-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:#475569;margin-top:5px;font-variant-numeric:tabular-nums;}
  .rt-meta b{font-weight:600;color:var(--faint);margin-right:3px;}
  .rt-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
  .mini-btn{
    font:inherit;font-size:12px;padding:5px 12px;border-radius:var(--radius);cursor:pointer;
    border:1px solid var(--border);background:#f8fafc;color:#334155;
    transition:background .15s,border-color .15s,color .15s;
  }
  .mini-btn:hover{background:#eef2f7;border-color:#cbd5e1;}
  .mini-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .mini-btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
  .mini-btn.danger:hover{background:#fff1f2;border-color:#fecdd3;color:#e11d48;}

  /* 评分 */
  .rate{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap;}
  .stars{display:inline-flex;gap:1px;font-size:15px;line-height:1;cursor:pointer;user-select:none;}
  .stars span{color:#cbd5e1;transition:color .12s,transform .12s;display:inline-block;}
  .stars span.on{color:var(--accent);}
  .stars span:hover{color:var(--accent);transform:scale(1.18);}
  .rate-info{font-size:11.5px;color:#475569;font-variant-numeric:tabular-nums;}

  /* 遮罩 / 弹窗 / 提示 */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.74);z-index:80;padding:24px;
    display:flex;align-items:center;justify-content:center;animation:fadeIn .16s ease;
  }
  .overlay[hidden]{display:none;}
  .overlay img{max-width:min(92vw,1080px);max-height:86vh;border-radius:var(--radius);background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .modal{background:#fff;border-radius:var(--radius);padding:18px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:fadeUp .2s ease both;}
  .modal h3{margin:0 0 8px;font-size:14.5px;}
  .modal p{margin:0 0 10px;font-size:12.5px;color:var(--muted);}
  .modal input[type=text]{font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:#0f172a;color:#fff;font-size:13px;padding:9px 18px;border-radius:var(--radius);
    box-shadow:0 10px 26px rgba(15,23,42,.3);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:90;max-width:82vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---------- 响应式 ---------- */
  @media (max-width:1220px){
    .layout{grid-template-columns:280px minmax(0,1fr);}
    .detail-panel{grid-column:1 / -1;}
    .cs-grid{grid-template-columns:1fr;}
  }
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;padding:12px 14px 0;}
    .timeline-wrap{padding:12px 14px 26px;}
    .cs-wrap{padding:12px 14px 30px;}
    .topbar{padding:16px 14px 2px;}
    .detail-body{min-height:0;}
    .cm-form-actions{flex-direction:column;align-items:stretch;}
    .cm-form-actions .hint{text-align:center;}
  }
</style>
</head>
<body>

<header class="topbar">
  <h1><span class="mark"></span>旅程拼图 · 路线规划器</h1>
  <span class="sub">输入出发点与预算，一键拼出一条可执行的路线 · 数据为模拟生成</span>
</header>

<main class="layout">

  <!-- ============ 左侧：控制面板 ============ -->
  <aside class="panel control-panel">
    <div class="panel-head"><span>行程参数</span><span class="meta">PLANNER</span></div>
    <div class="panel-body">
      <div class="field tip-field">
        <label for="origin">出发地</label>
        <input type="text" id="origin" value="武汉" placeholder="例如：武汉" autocomplete="off">
        <div class="tip-list" id="originTips" hidden></div>
      </div>
      <div class="field tip-field">
        <label for="dest">目的地</label>
        <input type="text" id="dest" value="长沙" placeholder="例如：长沙" autocomplete="off">
        <div class="tip-list" id="destTips" hidden></div>
      </div>
      <div class="field">
        <label for="budget">预算 <span id="budgetLabel" style="color:var(--primary);float:right;font-variant-numeric:tabular-nums;">¥1000</span></label>
        <input type="range" id="budget" min="200" max="2000" step="50" value="1000">
        <div class="range-scale"><span>¥200</span><span>¥2000</span></div>
      </div>
      <div class="field">
        <label>行程时长</label>
        <div class="seg" id="seg">
          <button type="button" data-hours="24">24h</button>
          <button type="button" data-hours="48" class="active">48h</button>
          <button type="button" data-hours="72">72h</button>
        </div>
      </div>
      <div class="field">
        <label>数据源</label>
        <div class="seg" id="srcSeg">
          <button type="button" data-src="mock" class="active">模拟数据</button>
          <button type="button" data-src="amap">真实数据</button>
        </div>
      </div>
      <div class="field" id="keyField" hidden>
        <label for="amapKey">高德 Web 服务 Key</label>
        <input type="text" id="amapKey" placeholder="粘贴自己的 key（restapi 类型）" autocomplete="off" spellcheck="false">
        <div class="range-scale"><span>仅保存在本机浏览器</span><span id="keyState"></span></div>
      </div>
      <button class="btn" id="generate">生成行程</button>

      <button class="btn dark" id="importItinerary" type="button">导入分享路线</button>
      <button class="btn dark" id="saveRoute">保存当前路线</button>
      <button class="btn dark" id="shareCurrent" type="button">分享当前路线</button>

      <div class="budget">
        <div class="budget-head">
          <span>预算消耗</span>
          <span class="amt" id="budgetAmt">¥0 / ¥1000</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="budget-note" id="budgetNote">尚未生成行程</div>
      </div>
    </div>
  </aside>

  <!-- ============ 中间：地图 ============ -->
  <section class="panel map-panel">
    <div class="panel-head">
      <span>路线图</span>
      <span class="map-head-right">
        <span class="seg mini" id="tileSeg" hidden>
          <button type="button" data-ltype="1" class="active" title="仅地块：去掉铁路、高速公路与全部注记">极简</button>
          <button type="button" data-ltype="3" title="地块 + 路网，无文字注记">路网</button>
          <button type="button" data-ltype="8" title="纯色底图">纯色</button>
          <button type="button" data-ltype="0" title="高德标准底图（含注记）">标准</button>
        </span>
        <span class="meta" id="mapMeta">—</span>
      </span>
    </div>
    <div class="map-wrap" data-mode="svg">
      <!-- 真实瓦片地图（真实数据模式） -->
      <div class="tile-map" id="tileMap" hidden>
        <div class="tile-layer" id="tileLayer"></div>
        <svg class="tile-overlay" id="tileOverlay" aria-hidden="true"></svg>
      </div>

      <!-- 手绘抽象地图（模拟数据模式） -->
      <svg id="map" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="行程路线示意图"></svg>

      <div class="map-hint">滚轮缩放 · 拖拽平移 · 双击复位</div>
      <div class="map-scenes" id="sceneSwitch" hidden>
        <button type="button" data-scene="inter" class="active">路线导航</button>
        <button type="button" data-scene="city">景区漫游</button>
      </div>
      <div class="map-tools">
        <button type="button" id="zoomIn" title="放大" aria-label="放大">＋</button>
        <button type="button" id="zoomOut" title="缩小" aria-label="缩小">－</button>
        <button type="button" id="zoomFit" title="适应路线" aria-label="适应路线">⤢</button>
      </div>
      <div class="scale-bar" id="scaleBar" hidden><i></i><span>—</span></div>

      <div class="legend">
        <span class="lg lg-hot"><i style="background:#22c55e"></i>景点</span>
        <span class="lg lg-hot"><i style="background:#f59e0b"></i>餐饮</span>
        <span class="lg lg-hot"><i style="background:#8b5cf6"></i>住宿</span>
        <span class="lg lg-transport"><i style="background:#3b82f6"></i>交通</span>
        <span class="lg lg-medical"><i style="background:#ef4444"></i>医疗</span>
      </div>
    </div>
    <div class="panel-foot" id="routeNote">模拟数据模式：地点与时间为随机生成，仅用于演示。</div>
  </section>

  <!-- ============ 右侧：详情 ============ -->
  <aside class="panel detail-panel">
    <div class="panel-head"><span>地点详情</span><span class="meta">DETAIL</span></div>
    <div class="detail-body" id="detailBody"></div>
  </aside>

</main>

<!-- ============ 底部：时间轴 ============ -->
<section class="timeline-wrap">
  <div class="panel">
    <div class="panel-head"><span>行程时间轴</span><span class="meta" id="tlMeta">—</span></div>
    <div class="tl-body">
      <div class="tl-hint" id="tlHint">横向拖动卡片可调整顺序 · 松手后自动重新规划路线</div>
      <div class="timeline" id="timeline"></div>
      <div class="tl-sum" id="tlSum"></div>
    </div>
  </div>
</section>

<!-- ============ 底部：评论 / 我的路线 / 社区路线 ============ -->
<section class="cs-wrap">
  <div class="cs-grid">

    <!-- 路线评论 -->
    <div class="panel">
      <div class="panel-head"><span>路线评论</span><span class="meta" id="cmRouteMeta">—</span></div>
      <div class="panel-body">
        <div class="cm-form">
          <div class="cm-form-row">
            <input type="text" id="cmUser" placeholder="昵称（留空则随机生成）" maxlength="16" autocomplete="off">
            <label class="file-btn" for="cmImage">📎 选择图片</label>
            <input type="file" id="cmImage" accept="image/*" hidden>
          </div>
          <textarea id="cmText" placeholder="说说这条路线值不值得走…"></textarea>
          <div class="cm-preview" id="cmPreview" hidden>
            <img id="cmPreviewImg" alt="图片预览">
            <button type="button" class="mini-btn danger" id="cmPreviewDel">移除图片</button>
          </div>
          <div class="cm-form-actions">
            <span class="hint" id="cmHint">图片会压缩后保存在本机浏览器</span>
            <button class="btn small" id="cmSubmit" type="button">发表评论</button>
          </div>
        </div>
        <div class="cm-list" id="cmList"></div>
      </div>
    </div>

    <div class="cs-col">
      <!-- 我的路线 -->
      <div class="panel">
        <div class="panel-head"><span>我的路线</span><span class="meta" id="myMeta">0 条</span></div>
        <div class="list-body" id="myList"></div>
      </div>
      <!-- 社区路线 -->
      <div class="panel">
        <div class="panel-head"><span>社区路线</span><span class="meta" id="communityMeta">0 条</span></div>
        <div class="list-body" id="communityList"></div>
      </div>
    </div>

  </div>
</section>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast"></div>

<script>

  var TIP_POOL = {
    transport: [
      '发车前 30 分钟到检票口就够，节假日建议再提前 20 分钟。',
      '选座优先靠窗的 A / F 座，看风景更舒服。',
      '把身份证放在随手能拿到的口袋，出站换乘会快很多。'
    ],
    attraction: [
      '工作日上午人最少，午后两点开始排队。',
      '从东门进、南门出可以少走大约一公里的回头路。',
      '门口的自动售票机比人工窗口快很多。',
      '带上充电宝，园区里共享充电柜经常被借空。'
    ],
    food: [
      '避开 12:00–13:00 的用餐高峰，能省下至少二十分钟。',
      '招牌菜需要现场点单，扫码菜单里不一定有。',
      '两个人点三份足够，分量比看起来大。'
    ],
    lodging: [
      '入住时问一句有没有高层房，通常可以免费升级。',
      '退房时间 12:00，可以申请延迟到 14:00。',
      '前台可以借到雨伞和转换插头，不用自己带。'
    ],
    medical: [
      '提前存好酒店到最近医院的打车路线，以备不时之需。',
      '随身带好医保卡或电子凭证，异地就医挂号会快一些。',
      '常规药品建议在市区药店购买，比景区周边便宜。'
    ]
  };

  var COMMENT_NAMES = ['阿然','小满','Luna','老周','橙子汽水','Nemo','十七','小鹿','阿吉','Winnie','柚子','大熊'];
  var COMMENT_TEXTS = [
    '按攻略来的，确实没踩雷，节奏刚刚好。',
    '人有点多，不过还是值得来一次。',
    '价格比想象中便宜，性价比很高。',
    '建议早点到，下午就挤不进去了。',
    '拍出来的照片比现场还好看，哈哈。',
    '老板很热情，主动帮我们指了路。',
    '整体不错，就是附近不太好停车。',
    '第二次来了，还是喜欢这个角落。'
  ];

  /* =========================================================
   * 1. 伪随机：相同输入 → 相同结果
   * =======================================================*/
  function hashStr(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* =========================================================
   * 2. 工具函数
   * =======================================================*/
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    return e;
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(mins) {
    var d = Math.floor(mins / 1440) + 1;
    var m = ((mins % 1440) + 1440) % 1440;
    return 'D' + d + ' ' + pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
  }
  function fmtDur(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + '小时' + m + '分';
    if (h) return h + '小时';
    return m + '分钟';
  }
  function yuan(n) { return '¥' + Math.round(n); }
  function shortName(name, max) {
    max = max || 8;
    return name.length > max ? name.slice(0, max - 1) + '…' : name;
  }

  /* =========================================================
   * 3. 模拟数据生成
   * =======================================================*/
  function buildMockPlan(input) {
    var from = (input.from || '').trim() || '武汉';
    var to   = (input.to   || '').trim() || '长沙';
    var budget = input.budget;
    var duration = input.duration;

    var seed = hashStr(from + '|' + to + '|' + budget + '|' + duration);
    var rng = mulberry32(seed);
    var ri = function (a, b) { return a + Math.floor(rng() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rng() * arr.length)]; };

    // ---- 地点数量 ----
    var n = duration === 24 ? 7 : duration === 48 ? 10 : 13;

    // ---- 类型序列 ----
    var kinds = new Array(n);
    kinds[0] = 'transport-out';
    kinds[n - 1] = 'transport-back';
    var lodgingIdx = duration >= 48 ? Math.max(1, Math.round((n - 2) * 0.5)) : -1;
    if (lodgingIdx > 0) kinds[lodgingIdx] = 'lodging';
    for (var i = 1; i < n - 1; i++) {
      if (kinds[i]) continue;
      kinds[i] = rng() < 0.38 ? 'food' : 'attraction';
    }

    // ---- 名称 ----
    var used = {};
    function takeName(pool, allowCityPrefix) {
      for (var t = 0; t < 40; t++) {
        var base = pick(pool);
        var nm = (allowCityPrefix && rng() < 0.4) ? (to + '·' + base) : base;
        if (!used[nm]) { used[nm] = 1; return nm; }
      }
      return pool[ri(0, pool.length - 1)] + ' ' + ri(2, 9) + '号';
    }

    var nodes = [];
    for (var j = 0; j < n; j++) {
      var kindCode = kinds[j];
      var baseKind = kindCode.indexOf('transport') === 0 ? 'transport' : kindCode;
      var meta = TYPE_META[baseKind];
      var name, typeLabel;

      if (kindCode === 'transport-out') {
        name = '高铁 ' + from + ' → ' + to;
        typeLabel = '去程交通';
      } else if (kindCode === 'transport-back') {
        name = '高铁 ' + to + ' → ' + from;
        typeLabel = '返程交通';
      } else if (kindCode === 'lodging') {
        name = (rng() < 0.5 ? to + '·' : '') + pick(['青年旅舍','设计民宿','老城客栈','快捷酒店']);
        typeLabel = '住宿';
      } else {
        name = takeName(NAME_POOL[baseKind], true);
        typeLabel = baseKind === 'food' ? '餐饮' : '景点';
      }

      nodes.push({
        index: j,
        kind: baseKind,
        kindCode: kindCode,
        typeLabel: typeLabel,
        name: name,
        icon: meta.icon,
        color: meta.color,
        weight: WEIGHT[baseKind]
      });
    }

    // ---- 费用：按权重分配「分配总额」 ----
    // 基准 88%，叠加种子浮动，使 90% 警示线真实可触发
    var ratio = 0.88 + (rng() - 0.5) * 0.16;
    ratio = Math.max(0.78, Math.min(0.97, ratio));
    var allocated = Math.round(budget * ratio);

    var wSum = nodes.reduce(function (s, x) { return s + x.weight; }, 0);
    var acc = 0;
    nodes.forEach(function (nd, idx) {
      if (idx === nodes.length - 1) {
        nd.cost = Math.max(0, allocated - acc);
      } else {
        nd.cost = Math.round(allocated * nd.weight / wSum);
        acc += nd.cost;
      }
    });
    // 校正舍入误差
    var total = nodes.reduce(function (s, x) { return s + x.cost; }, 0);
    if (total !== allocated) nodes[nodes.length - 1].cost += (allocated - total);

    // ---- 时间：D1 07:30 出发，间隔 1~3 小时，跨天自动处理 ----
    var START = 7 * 60 + 30;
    var durations = nodes.map(function (nd) {
      if (nd.kind === 'transport') return ri(120, 180);
      if (nd.kind === 'lodging')   return 480;
      if (nd.kind === 'food')      return ri(60, 90);
      return ri(90, 150);
    });

    var target = duration * 60 - 45; // 末段留 45 分钟缓冲
    var sumD = durations.reduce(function (a, b) { return a + b; }, 0);
    var gaps = [];
    for (var g = 0; g < n - 1; g++) gaps.push(ri(60, 180));
    var sumG = gaps.reduce(function (a, b) { return a + b; }, 0);
    var gapBudget = Math.max(target - sumD, (n - 1) * 30);
    var scale = gapBudget / sumG;
    gaps = gaps.map(function (v) { return Math.max(20, Math.round(v * scale / 5) * 5); });

    var cursor = START;
    nodes.forEach(function (nd, idx) {
      nd.start = cursor;
      nd.duration = durations[idx];
      nd.end = cursor + nd.duration;
      cursor = nd.end + (gaps[idx] || 0);
      // 记录到上一站的移动方式与耗时，供路线中点标注使用
      nd.legFromPrev = idx > 0
        ? { mode: 'walking', minutes: gaps[idx - 1] || 0, km: 0, approx: true }
        : null;
    });
    var totalSpan = nodes[n - 1].end - START;

    // ---- 文案：每个地点预置 3~5 条，随机选用 ----
    nodes.forEach(function (nd) {
      var dp = DESC_POOL[nd.kind], tp = TIP_POOL[nd.kind];
      var dCount = Math.min(dp.length, ri(3, 5));
      var tCount = Math.min(tp.length, ri(3, 5));
      nd.desc = dp[ri(0, dCount - 1)];
      nd.tip  = tp[ri(0, tCount - 1)];

      var cCount = ri(2, 3);
      var usedNames = {};
      nd.comments = [];
      for (var c = 0; c < cCount; c++) {
        var cname = pick(COMMENT_NAMES);
        var guard = 0;
        while (usedNames[cname] && guard++ < 20) cname = pick(COMMENT_NAMES);
        usedNames[cname] = 1;
        nd.comments.push({
          name: cname,
          rating: ri(4, 5),
          text: pick(COMMENT_TEXTS),
          date: '2024-' + pad2(ri(1, 12)) + '-' + pad2(ri(1, 28))
        });
      }
    });

    // ---- 地图坐标：蛇形网格 + 随机偏移 ----
    var mapRng = mulberry32(hashStr(seed + '::map'));
    var mr = function (a, b) { return a + mapRng() * (b - a); };
    var cols = n <= 7 ? 4 : 5;
    var rows = Math.ceil(n / cols);
    var PADX = 105, PADY = 95;
    var stepX = cols > 1 ? (900 - PADX * 2) / (cols - 1) : 0;
    var stepY = rows > 1 ? (620 - PADY * 2) / (rows - 1) : 0;

    nodes.forEach(function (nd, idx) {
      var row = Math.floor(idx / cols);
      var colInRow = idx % cols;
      var col = (row % 2 === 0) ? colInRow : (cols - 1 - colInRow);
      var x = PADX + col * stepX + mr(-24, 24);
      var y = (rows > 1 ? PADY + row * stepY : 310) + mr(-22, 22);
      nd.x = Math.max(50, Math.min(850, x));
      nd.y = Math.max(50, Math.min(570, y));
    });

    // 驻点漫游布局：去程锚在出发地、返程锚在目的地，市内节点收成一圈，形成两段视图
    nodes[0].x = 118; nodes[0].y = 118;
    var lastNode = nodes.length - 1;
    nodes[lastNode].x = 690; nodes[lastNode].y = 500;
    var cxc = 640, cyc = 400, rr = 150;
    for (var hi = 1; hi < lastNode; hi++) {
      var ang = (hi - 1) / Math.max(1, lastNode - 1) * Math.PI * 2;
      nodes[hi].x = cxc + Math.cos(ang) * rr * (0.7 + mr(0, 0.5));
      nodes[hi].y = cyc + Math.sin(ang) * rr * (0.7 + mr(0, 0.5));
    }
    nodes[0].section = 'inter';
    nodes[lastNode].section = 'inter';
    for (var si = 1; si < lastNode; si++) nodes[si].section = 'city';

    return {
      from: from, to: to, budget: budget, duration: duration,
      seed: seed, nodes: nodes,
      allocated: allocated, ratio: ratio,
      totalSpan: totalSpan,
      mode: 'hub',
      scenes: [
        { id: 'inter', label: '路线导航', indices: [0, nodes.length - 1] },
        { id: 'city',  label: '景区漫游', indices: citySceneIndices(nodes.length - 1) }
      ]
    };
  }

  /* =========================================================
   * 3.5 真实数据接入（高德 Web 服务 API）
   *     —— 输出与 buildMockPlan 完全相同的 plan 结构，
   *        因此地图/时间轴/详情/预算条等 UI 层无需改动。
   * =======================================================*/
  var AMAP_BASE = 'https://restapi.amap.com/v3/';
  var LS_AMAP_KEY = 'jp.amapKey.v1';

  function amapKey() {
    var el = document.getElementById('amapKey');
    var v = el ? String(el.value || '').trim() : '';
    if (v) return v;
    return lsGet(LS_AMAP_KEY, '') || '';
  }

  function qs(obj) {
    return Object.keys(obj).filter(function (k) {
      return obj[k] !== undefined && obj[k] !== null && obj[k] !== '';
    }).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]);
    }).join('&');
  }

  // fetch 优先，失败（CORS/网络）自动退化为 JSONP
  function httpJSON(url, timeout) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function () {
        if (done) return; done = true;
        if (ctrl) ctrl.abort();
        reject(new Error('TIMEOUT'));
      }, timeout || 12000);
      var opts = { method: 'GET' };
      if (ctrl) opts.signal = ctrl.signal;
      fetch(url, opts).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (d) {
        if (done) return; done = true; clearTimeout(timer); resolve(d);
      }).catch(function (e) {
        if (done) return; done = true; clearTimeout(timer); reject(e);
      });
    });
  }

  function jsonp(url, timeout) {
    return new Promise(function (resolve, reject) {
      var cb = '__amap_cb_' + Math.floor(Math.random() * 1e9);
      var s = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () { finish(new Error('TIMEOUT')); }, timeout || 12000);
      function finish(err, data) {
        if (done) return; done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
        if (err) reject(err); else resolve(data);
      }
      window[cb] = function (data) { finish(null, data); };
      s.onerror = function () { finish(new Error('SCRIPT_ERROR')); };
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      document.body.appendChild(s);
    });
  }

  function amapGet(path, params) {
    var key = amapKey();
    if (!key) return Promise.reject(new Error('NO_KEY'));
    var url = AMAP_BASE + path + '?' + qs(Object.assign({ key: key, output: 'JSON' }, params));
    return amapRaw(url).then(function (d) {
      // 个人 Key 的 QPS 很低，撞到限流就地退避重试，不要往下降级到更糟的数据源
      var info = String((d && d.info) || '');
      if (d && String(d.status) !== '1' && /CUQPS|QPS|TOO_FREQUENT|LIMIT/i.test(info)) {
        return new Promise(function (r) { setTimeout(r, 900); }).then(function () {
          return httpJSON(url).catch(function () { return jsonp(url); });
        });
      }
      return d;
    });
  }

  // 所有高德请求统一排队：上一个结束后再等 AMAP_GAP 才开始下一个
  var AMAP_GAP = 200;
  var amapChain = Promise.resolve();

  function amapRaw(url) {
    var task = amapChain
      .then(function () { return new Promise(function (res) { setTimeout(res, AMAP_GAP); }); })
      .then(function () { return httpJSON(url).catch(function () { return jsonp(url); }); });
    amapChain = task.then(function () {}, function () {});
    return task;
  }

  function amapOk(d) {
    if (!d || String(d.status) !== '1') {
      var info = String((d && d.info) || '');
      if (/INVALID_USER_KEY|USERKEY_PLAT_NOMATCH|INVALID_USER_SCODE|SERVICE_NOT_AVAILABLE/i.test(info)) {
        throw new Error('KEY_INVALID');
      }
      if (/OVER_LIMIT|QUOTA|DAILY/i.test(info)) throw new Error('QUOTA');
      throw new Error(info || 'AMAP_ERROR');
    }
    return d;
  }

  // 并发上限，避免触发 QPS 限制
  function mapLimit(items, limit, fn) {
    var out = new Array(items.length), cursor = 0;
    function next() {
      if (cursor >= items.length) return Promise.resolve();
      var idx = cursor++;
      return Promise.resolve(fn(items[idx], idx)).then(function (v) { out[idx] = v; return next(); });
    }
    var runners = [];
    for (var i = 0; i < Math.min(limit, items.length); i++) runners.push(next());
    return Promise.all(runners).then(function () { return out; });
  }

  // 「经度,纬度」字符串 → {lng, lat}
  function parseLoc(s) {
    var p = String(s || '').split(',');
    return { lng: parseFloat(p[0]), lat: parseFloat(p[1]) };
  }

  function amapGeo(address) {
    return amapGet('geocode/geo', { address: address }).then(function (d) {
      amapOk(d);
      var g = (d.geocodes || [])[0];
      if (!g) throw new Error('NOT_FOUND:' + address);
      var ll = parseLoc(g.location);
      if (!isFinite(ll.lng) || !isFinite(ll.lat)) throw new Error('NOT_FOUND:' + address);
      return {
        name: address,
        city: (typeof g.city === 'string' && g.city) ? g.city : address,
        adcode: (typeof g.adcode === 'string' && g.adcode) ? g.adcode : '',
        formatted: (typeof g.formatted_address === 'string' && g.formatted_address) ? g.formatted_address : address,
        lng: ll.lng, lat: ll.lat
      };
    });
  }

  function amapPoi(opts, city, pages) {
    var types = typeof opts === 'string' ? opts : (opts.types || '');
    var keywords = (typeof opts === 'object' && opts.keywords) ? opts.keywords : '';
    // 默认只在指定城市内搜；citylimit:false 时放开到全国
    var citylimit = (typeof opts === 'object' && opts.citylimit === false) ? 'false' : 'true';
    var reqs = [];
    for (var p = 1; p <= (pages || 1); p++) {
      reqs.push(amapGet('place/text', {
        types: types, keywords: keywords, city: city, citylimit: citylimit,
        offset: 25, page: p, extensions: 'all'
      }).then(function (d) {
        amapOk(d);
        return (d.pois || []).map(function (poi) {
          var ll = parseLoc(poi.location);
          var biz = poi.biz_ext || {};
          var photos = poi.photos || [];
          return {
            name: String(poi.name || ''),
            type: typeof poi.type === 'string' ? poi.type : '',
            address: typeof poi.address === 'string' ? poi.address : '',
            tel: typeof poi.tel === 'string' ? poi.tel : '',
            rating: (biz.rating !== undefined && biz.rating !== null && biz.rating !== '') ? String(biz.rating) : '',
            refCost: (biz.cost !== undefined && biz.cost !== null && biz.cost !== '' && +biz.cost > 0) ? +biz.cost : 0,
            photo: (photos[0] && photos[0].url) ? String(photos[0].url) : '',
            lng: ll.lng, lat: ll.lat
          };
        });
      }).catch(function () { return []; }));
    }
    return Promise.all(reqs).then(function (lists) {
      var seen = {}, out = [];
      lists.forEach(function (list) {
        list.forEach(function (poi) {
          if (!poi.name || !isFinite(poi.lng) || !isFinite(poi.lat) || seen[poi.name]) return;
          seen[poi.name] = 1;
          out.push(poi);
        });
      });
      return out;
    });
  }

  // 城际交通：同时问公共交通与驾车，取较快者排程，并把两个方案都摆出来。
  // 高德路径规划不含高铁班次，公交方案常常是长途大巴，所以必须让用户看到两个数。
  function amapInterCity(from, to) {
    var transitP = amapGet('direction/transit/integrated', {
      origin: from.lng + ',' + from.lat,
      destination: to.lng + ',' + to.lat,
      city: from.adcode, cityd: to.adcode, strategy: 0
    }).then(function (d) {
      amapOk(d);
      var t = d.route && d.route.transits && d.route.transits[0];
      if (!t) throw new Error('NO_TRANSIT');
      return {
        mode: 'transit',
        minutes: Math.max(20, Math.round(+t.duration / 60)),
        refCost: +t.cost > 0 ? +t.cost : 0,
        distanceKm: +t.distance > 0 ? Math.round(+t.distance / 1000) : 0
      };
    }).catch(function () { return null; });

    var driveP = amapGet('direction/driving', {
      origin: from.lng + ',' + from.lat,
      destination: to.lng + ',' + to.lat,
      extensions: 'base'
    }).then(function (d) {
      amapOk(d);
      var p = d.route && d.route.paths && d.route.paths[0];
      if (!p) throw new Error('NO_ROUTE');
      return {
        mode: 'driving',
        minutes: Math.max(20, Math.round(+p.duration / 60)),
        refCost: +p.tolls > 0 ? +p.tolls : 0,
        distanceKm: +p.distance > 0 ? Math.round(+p.distance / 1000) : 0
      };
    }).catch(function () { return null; });

    return Promise.all([transitP, driveP]).then(function (r) {
      var t = r[0], d = r[1];
      if (!t && !d) throw new Error('NO_ROUTE');
      var best = !t ? d : (!d ? t : (t.minutes <= d.minutes ? t : d));
      best.alternatives = [];
      if (t) best.alternatives.push({ mode: t.mode, minutes: t.minutes, km: t.distanceKm });
      if (d) best.alternatives.push({ mode: d.mode, minutes: d.minutes, km: d.distanceKm });
      return best;
    });
  }

  function interNoteText(inter) {
    if (!inter) return '';
    if (inter.alternatives && inter.alternatives.length > 1) {
      return '高德路径规划：' + inter.alternatives.map(function (a) {
        return modeLabel(a.mode) + ' ' + fmtDur(a.minutes) + (a.km ? '（' + a.km + ' 公里）' : '');
      }).join('；') + '　已按较快方案排程。注意高德路径规划不含高铁班次。';
    }
    return (inter.mode === 'driving' ? '驾车方案' : '公共交通方案') +
           (inter.distanceKm ? ' · 约 ' + inter.distanceKm + ' 公里' : '');
  }

  function haversineKm(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  // 城内移动耗时：直线距离 × 1.35 绕行系数 ÷ 4.5km/h 步行等效速度
  function cityLegMinutes(a, b) {
    var km = haversineKm(a, b) * 1.35;
    return Math.max(10, Math.min(150, Math.round(km / 4.5 * 60 / 5) * 5));
  }

  // 贪心最近邻排序，得到一条不来回穿插的访问顺序
  function nearestNeighborOrder(start, pois) {
    var rest = pois.slice(), out = [], cur = start;
    while (rest.length) {
      var best = 0, bestD = Infinity;
      for (var i = 0; i < rest.length; i++) {
        var d = haversineKm(cur, rest[i]);
        if (d < bestD) { bestD = d; best = i; }
      }
      cur = rest.splice(best, 1)[0];
      out.push(cur);
    }
    return out;
  }

  function amapErrorText(e) {
    var m = String((e && e.message) || e);
    if (m === 'NO_KEY') return '请先填写高德 Web 服务 Key';
    if (m === 'KEY_INVALID') return 'Key 无效或类型不符（需 Web 服务 key）';
    if (m === 'QUOTA') return '高德接口额度已用尽，请稍后再试';
    if (m === 'TIMEOUT') return '高德接口超时';
    if (m === 'SCRIPT_ERROR') return '浏览器直连被拦截，建议加后端代理';
    if (m.indexOf('NOT_FOUND:') === 0) return '未找到地点：' + m.slice(10);
    return '高德接口返回异常：' + m;
  }

  // 输入提示：用于出发地/目的地的模糊搜索联想
  function amapTips(keywords, city) {
    return amapGet('assistant/inputtips', {
      keywords: keywords, city: city || '', citylimit: 'false', datatype: 'all'
    }).then(function (d) {
      amapOk(d);
      return (d.tips || []).map(function (t) {
        var loc = typeof t.location === 'string' ? parseLoc(t.location) : { lng: NaN, lat: NaN };
        return {
          name: String(t.name || t.district || ''),
          district: String(t.district || ''),
          adcode: String(t.adcode || ''),
          city: Array.isArray(t.city) ? '' : String(t.city || ''),
          address: typeof t.address === 'string' ? t.address : '',
          lng: loc.lng, lat: loc.lat
        };
      }).filter(function (t) { return t.name; });
    });
  }

  // 驻点漫游下「景区漫游」视图包含的节点：目的地的全部节点（含返程出发点）
  function citySceneIndices(lastI) {
    var a = [];
    for (var i = 1; i <= lastI; i++) a.push(i);
    return a;
  }

  /* --- 主入口：真实数据规划 --------------------------------- */

  // 输入联想：把用户选中的候选点直接当解析结果用，省掉一次地理编码
  var pickedPlace = { origin: null, dest: null };

  function resolvePlace(text, hint) {
    if (hint && hint.name === text && isFinite(hint.lng) && isFinite(hint.lat)) {
      return Promise.resolve({
        name: text, city: hint.city || hint.district || text,
        adcode: hint.adcode || '', formatted: hint.address || text,
        lng: hint.lng, lat: hint.lat, picked: true
      });
    }
    return amapGeo(text);
  }

  // 采集自高德的路径折线可能上千个点，先按距离抽稀，
  // 否则拖动地图时每帧重建 path 字符串会卡。
  function simplifyPolyline(pts, minMeters) {
    if (!pts || pts.length <= 2) return pts || [];
    var out = [pts[0]], last = pts[0];
    for (var i = 1; i < pts.length; i++) {
      if (haversineKm(last, pts[i]) * 1000 >= minMeters) { out.push(pts[i]); last = pts[i]; }
    }
    var tail = pts[pts.length - 1];
    if (out[out.length - 1] !== tail) out.push(tail);
    return out;
  }

  /* --- 市内分段：按距离自动挑选交通方式 ---
     步行 < 1.2km ／ 骑行 1.2~3.5km ／ 公交地铁 3.5~9km ／ 驾车 > 9km
     每种方式失败会自动降级到下一档，最终退化成直线估算。 */
  function pickLegMode(km) {
    if (km < 1.2) return 'walking';
    if (km < 3.5) return 'bicycling';
    if (km < 9) return 'transit';
    return 'driving';
  }

  function decodeSteps(steps) {
    var pts = [];
    (steps || []).forEach(function (st) {
      String(st.polyline || '').split(';').forEach(function (pair) {
        var q = pair.split(',');
        if (q.length === 2 && isFinite(+q[0]) && isFinite(+q[1])) pts.push({ lng: +q[0], lat: +q[1] });
      });
    });
    return pts;
  }

  function legWalking(from, to) {
    return amapGet('direction/walking', {
      origin: from.lng + ',' + from.lat, destination: to.lng + ',' + to.lat
    }).then(function (d) {
      amapOk(d);
      var p = d.route && d.route.paths && d.route.paths[0];
      if (!p) throw new Error('NO_WALK');
      var pts = decodeSteps(p.steps);
      return {
        mode: 'walking',
        minutes: Math.max(2, Math.round(+p.duration / 60)),
        km: +p.distance > 0 ? (+p.distance / 1000) : haversineKm(from, to) * 1.3,
        polyline: simplifyPolyline(pts.length >= 2 ? pts : [from, to], 70)
      };
    });
  }

  // 骑行走 v4 接口：返回结构是 {errcode, data:{paths:[…]}}
  function legBicycling(from, to) {
    var key = amapKey();
    if (!key) return Promise.reject(new Error('NO_KEY'));
    var url = 'https://restapi.amap.com/v4/direction/bicycling?' +
              qs({ key: key, origin: from.lng + ',' + from.lat, destination: to.lng + ',' + to.lat });
    return amapRaw(url).then(function (d) {
      if (!d || Number(d.errcode) !== 0) throw new Error('NO_BIKE');
      var p = d.data && d.data.paths && d.data.paths[0];
      if (!p) throw new Error('NO_BIKE');
      var pts = decodeSteps(p.steps);
      return {
        mode: 'bicycling',
        minutes: Math.max(2, Math.round(+p.duration / 60)),
        km: +p.distance > 0 ? (+p.distance / 1000) : haversineKm(from, to) * 1.3,
        polyline: simplifyPolyline(pts.length >= 2 ? pts : [from, to], 70)
      };
    });
  }

  // 市内公交/地铁：把各段（步行 + 公交）的折线拼起来
  function legTransit(from, to, adcode) {
    if (!adcode) return Promise.reject(new Error('NO_CITY'));
    return amapGet('direction/transit/integrated', {
      origin: from.lng + ',' + from.lat,
      destination: to.lng + ',' + to.lat,
      city: adcode, cityd: adcode, strategy: 0
    }).then(function (d) {
      amapOk(d);
      var t = d.route && d.route.transits && d.route.transits[0];
      if (!t) throw new Error('NO_TRANSIT');
      var pts = [];
      (t.segments || []).forEach(function (seg) {
        var w = seg.walking && seg.walking.steps;
        if (w) pts = pts.concat(decodeSteps(w));
        var bl = seg.bus && seg.bus.buslines && seg.bus.buslines[0];
        if (bl) pts = pts.concat(decodeSteps([{ polyline: bl.polyline }]));
      });
      return {
        mode: 'transit',
        minutes: Math.max(3, Math.round(+t.duration / 60)),
        km: +t.distance > 0 ? (+t.distance / 1000) : haversineKm(from, to) * 1.3,
        polyline: simplifyPolyline(pts.length >= 2 ? pts : [from, to], 70),
        refCost: +t.cost > 0 ? +t.cost : 0
      };
    });
  }

  function legDriving(from, to) {
    return amapGet('direction/driving', {
      origin: from.lng + ',' + from.lat,
      destination: to.lng + ',' + to.lat,
      extensions: 'base'
    }).then(function (d) {
      amapOk(d);
      var p = d.route && d.route.paths && d.route.paths[0];
      if (!p) throw new Error('NO_ROUTE');
      var pts = decodeSteps(p.steps);
      return {
        mode: 'driving',
        minutes: Math.max(3, Math.round(+p.duration / 60)),
        km: +p.distance > 0 ? (+p.distance / 1000) : haversineKm(from, to) * 1.35,
        polyline: simplifyPolyline(pts.length >= 2 ? pts : [from, to], 70)
      };
    });
  }

  var LEG_RUNNERS = {
    walking: legWalking,
    bicycling: legBicycling,
    transit: legTransit,
    driving: legDriving
  };

  function amapLeg(from, to, adcode) {
    var straight = haversineKm(from, to);
    var preferred = pickLegMode(straight);
    var chain = [preferred];
    ['walking', 'bicycling', 'transit', 'driving'].forEach(function (m) {
      if (chain.indexOf(m) < 0) chain.push(m);
    });

    function attempt(i) {
      if (i >= chain.length) return Promise.reject(new Error('ALL_FAILED'));
      var m = chain[i];
      return LEG_RUNNERS[m](from, to, adcode).then(function (r) {
        r.preferred = (m === preferred);
        return r;
      }).catch(function () { return attempt(i + 1); });
    }

    return attempt(0).catch(function () {
      // 单段失败不影响整体，退化成直线并标记为估算
      return {
        mode: preferred, approx: true, preferred: true,
        minutes: cityLegMinutes(from, to), km: straight * 1.35,
        polyline: [from, to]
      };
    });
  }

  // 到达/离开锚点：火车出行优先挑车站，自驾或长途才考虑机场
  function pickHub(list, city, preferRail) {
    var ALL = /火车站|高铁站|东站|南站|西站|北站|机场|客运站|汽车站/;
    var RAIL = /火车站|高铁站|东站|南站|西站|北站|客运站|汽车站/;
    var prefer = (list || []).filter(function (p) { return preferRail ? RAIL.test(p.name) : ALL.test(p.name); });
    if (!prefer.length) prefer = (list || []).filter(function (p) { return ALL.test(p.name); });
    var pool = prefer.length ? prefer : (list || []);
    if (!pool.length) return { name: city.city || city.formatted, lng: city.lng, lat: city.lat, isCity: true };
    var best = pool[0], bd = haversineKm(city, pool[0]);
    pool.forEach(function (p) {
      var d = haversineKm(city, p);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }

  // 把候选点按地理位置聚成 k 个片区（k-means，最远点初始化）
  function kmeansClusters(pois, k, rng) {
    if (pois.length <= k) return pois.map(function (p) { return [p]; });
    var centers = [pois[Math.floor(rng() * pois.length)]];
    while (centers.length < k) {
      var far = centers[0], farD = -1;
      pois.forEach(function (p) {
        var d = Infinity;
        centers.forEach(function (c) { d = Math.min(d, haversineKm(p, c)); });
        if (d > farD) { farD = d; far = p; }
      });
      centers.push(far);
    }
    var groups = [];
    for (var iter = 0; iter < 12; iter++) {
      groups = [];
      for (var i = 0; i < k; i++) groups.push([]);
      pois.forEach(function (p) {
        var bi = 0, bd = Infinity;
        for (var j = 0; j < k; j++) {
          var d = haversineKm(p, centers[j]);
          if (d < bd) { bd = d; bi = j; }
        }
        groups[bi].push(p);
      });
      for (var m = 0; m < k; m++) {
        if (!groups[m].length) continue;
        var sl = 0, sa = 0;
        groups[m].forEach(function (p) { sl += p.lng; sa += p.lat; });
        centers[m] = { lng: sl / groups[m].length, lat: sa / groups[m].length };
      }
    }
    return groups.filter(function (g) { return g.length; });
  }

  // 片区内部按最近邻排序；片区之间从锚点出发贪心选最近的下一个片区
  function orderDays(groups, start) {
    var remaining = groups.map(function (g) { return nearestNeighborOrder(start, g); });
    var out = [], cur = start;
    while (remaining.length) {
      var bi = 0, bd = Infinity;
      for (var i = 0; i < remaining.length; i++) {
        var d = haversineKm(cur, remaining[i][0]);
        if (d < bd) { bd = d; bi = i; }
      }
      var g = remaining.splice(bi, 1)[0];
      out.push(g);
      cur = g[g.length - 1];
    }
    return out;
  }

  function fetchPlan(input) {
    var from = (input.from || '').trim() || '武汉';
    var to = (input.to || '').trim() || '长沙';
    var budget = input.budget;
    var duration = input.duration;

    // 24h = 1 天 1 晚，48h = 2 天 2 晚，72h = 3 天 3 晚
    var days = duration === 24 ? 1 : duration === 48 ? 2 : 3;
    var n = duration === 24 ? 7 : duration === 48 ? 10 : 13;
    var nights = Math.min(days, Math.max(1, Math.round(duration / 24)));
    var seed = hashStr(['amap4', from, to, budget, duration].join('|'));
    var rng = mulberry32(seed);
    var ri = function (a, b) { return a + Math.floor(rng() * (b - a + 1)); };

    var ctx = {};

    return Promise.all([
      resolvePlace(from, input.fromHint),
      resolvePlace(to, input.toHint)
    ]).then(function (geo) {
      ctx.from = geo[0];
      ctx.to = geo[1];
      // 只取这五类：景点 / 餐饮 / 住宿 / 医疗 / 交通设施
      return Promise.all([
        amapInterCity(ctx.from, ctx.to).catch(function () { return null; }),
        amapPoi({ types: '110000' }, ctx.to.adcode, 2),   // 风景名胜
        amapPoi({ types: '050000' }, ctx.to.adcode, 2),   // 餐饮服务
        amapPoi({ types: '100000' }, ctx.to.adcode, 1),   // 住宿服务
        amapPoi({ types: '090000' }, ctx.to.adcode, 1),   // 医疗保健
        amapPoi({ types: '150000' }, ctx.to.adcode, 1)    // 交通设施（火车站/机场）
      ]);
    }).then(function (res) {
      var inter = res[0], spots = res[1], eats = res[2], hotels = res[3], meds = res[4], traffic = res[5];
      if (!spots.length && !eats.length) throw new Error('NO_POI');

      // ---- 1. 锚点：目的地的车站/机场 ----
      // 整条城市路线从这里开始、也在这里结束，因此地图只覆盖目的城市，
      // 不会被 300 公里外的出发地坐标把视野撑到省级。
      var hub = pickHub(traffic, ctx.to, !(inter && inter.mode === 'driving'));
      var center = { lng: hub.lng, lat: hub.lat };

      // ---- 2. 半径收口：剔除郊县景点，避免横跨半个省 ----
      function within(list, km) {
        return (list || []).filter(function (p) { return haversineKm(center, p) <= km; });
      }
      var spotsF = [], eatsF = [], hotelsF = [], medsF = [], radius = 30;
      [30, 60, 120, 240, Infinity].some(function (km) {
        radius = km;
        spotsF = within(spots, km); eatsF = within(eats, km);
        hotelsF = within(hotels, km); medsF = within(meds, km);
        return (spotsF.length + eatsF.length) >= (n - 2) * 2;
      });

      function byRating(a, b) { return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0); }
      spotsF.sort(byRating); eatsF.sort(byRating); hotelsF.sort(byRating); medsF.sort(byRating);

      // 高分优先，再在头部样本里按种子洗牌 —— 同样输入必然同样结果
      function take(pool, k) {
        if (k <= 0 || !pool.length) return [];
        var copy = pool.slice(0, Math.max(k * 3, 6));
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(rng() * (i + 1));
          var t = copy[i]; copy[i] = copy[j]; copy[j] = t;
        }
        return copy.slice(0, k);
      }

      // ---- 3. 名额分配：交通 2 + 住宿 nights + 其余为停靠点 ----
      var stopCount = Math.max(2, n - 2 - nights);
      var medCount = (duration >= 48 && rng() < 0.45) ? 1 : 0;
      var foodCount = Math.max(1, Math.round((stopCount - medCount) * 0.35));
      var spotCount = Math.max(1, stopCount - medCount - foodCount);

      var stops = [];
      take(spotsF, spotCount).forEach(function (p) { stops.push({ kind: 'attraction', poi: p }); });
      take(eatsF, foodCount).forEach(function (p) { stops.push({ kind: 'food', poi: p }); });
      take(medsF, medCount).forEach(function (p) { stops.push({ kind: 'medical', poi: p }); });
      if (stops.length < 2) throw new Error('NO_POI');

      // ---- 4. 按地理位置聚成 days 个片区 → 每天一片 → 片内最近邻 ----
      var kindOf = {};
      stops.forEach(function (s) { kindOf[s.poi.name] = s.kind; });
      var groups = kmeansClusters(stops.map(function (s) { return s.poi; }), days, rng);
      var dayPlans = orderDays(groups, hub).map(function (g) {
        return g.map(function (p) { return { kind: kindOf[p.name] || 'attraction', poi: p }; });
      });
      while (dayPlans.length < days) dayPlans.push([]);

      // ---- 5. 每晚住在当天最后一站附近 ----
      var usedHotel = {};
      function hotelNear(anchor) {
        var best = null, bd = Infinity;
        hotelsF.forEach(function (h) {
          if (usedHotel[h.name]) return;
          var d = haversineKm(anchor, h);
          if (d < bd) { bd = d; best = h; }
        });
        if (best) usedHotel[best.name] = 1;
        return best;
      }

      // ---- 6. 拼出完整的到访序列：车站 → 每天各站 → 每晚住宿 → 车站 ----
      var seq = [{ role: 'hub', poi: hub }];
      dayPlans.forEach(function (list, di) {
        list.forEach(function (s) { seq.push({ role: 'stop', kind: s.kind, poi: s.poi }); });
        if (di < nights) {
          var anchor = list.length ? list[list.length - 1].poi : hub;
          var h = hotelNear(anchor);
          if (h) seq.push({ role: 'lodging', kind: 'lodging', poi: h });
        }
      });
      seq.push({ role: 'hub', poi: hub });

      // ---- 7. 逐段取真实道路折线（并发 2，避免触发 QPS 限制）----
      var pairs = [];
      for (var i = 0; i < seq.length - 1; i++) pairs.push([seq[i].poi, seq[i + 1].poi]);

      return mapLimit(pairs, 2, function (pair) {
        return amapLeg(pair[0], pair[1], ctx.to.adcode);
      }).then(function (legs) {
        var approxLegs = legs.filter(function (l) { return l.approx; }).length;

        // ---- 8. 逐日排程：每天 08:30 开始，21:00 后收尾，夜宿接次晨 ----
        var nodes = [], legsOut = [];
        var mkNode = function (kind, kindCode, typeLabel, name, poi, extra) {
          var meta = TYPE_META[kind];
          return {
            index: 0, kind: kind, kindCode: kindCode, typeLabel: typeLabel,
            name: name, icon: meta.icon, color: meta.color, weight: WEIGHT[kind],
            real: extra || null, refCost: poi ? (poi.refCost || 0) : 0,
            lng: poi ? poi.lng : hub.lng, lat: poi ? poi.lat : hub.lat
          };
        };

        var cursor = 7 * 60 + 30;
        var dayNo = 1;
        var lastIdx;

        // 去程交通（节点落在出发地，返程落在目的地，中间是目的地微循环）
        var outDur = inter ? Math.max(30, Math.round(inter.minutes / 5) * 5) : ri(120, 180);
        var outNode = mkNode('transport', 'transport-out', '去程交通',
          (inter && inter.mode === 'driving' ? '驾车 ' : '公共交通 ') + from + ' → ' + to,
          { name: from, lng: ctx.from.lng, lat: ctx.from.lat }, inter ? {
            address: ctx.from.formatted + ' → ' + ctx.to.formatted,
            note: interNoteText(inter) + ' · 到达 ' + hub.name
          } : { note: '到达 ' + hub.name });
        outNode.start = cursor; outNode.duration = outDur; outNode.end = cursor + outDur;
        outNode.day = 1;
        outNode.section = 'inter';
        nodes.push(outNode);
        cursor = outNode.end;

        for (var s = 1; s < seq.length; s++) {
          var item = seq[s];
          var leg = legs[s - 1] || { minutes: 5, polyline: [] };
          cursor += leg.minutes;
          legsOut.push(leg.polyline);

          if (item.role === 'lodging') {
            var nextMorning = dayNo * 1440 + (8 * 60 + 30);
            var stay = Math.max(360, nextMorning - cursor);
            var hn = mkNode('lodging', 'lodging', '住宿', item.poi.name, item.poi, poiReal(item.poi));
            hn.start = cursor; hn.duration = stay; hn.end = cursor + stay; hn.day = dayNo;
            hn.legFromPrev = leg; hn.section = 'city';
            nodes.push(hn);
            cursor += stay;
            dayNo += 1;
          } else if (item.role === 'hub') {
            var back = mkNode('transport', 'transport-back', '返程交通',
              (inter && inter.mode === 'driving' ? '驾车 ' : '公共交通 ') + to + ' → ' + from,
              hub, { address: ctx.to.formatted + ' → ' + ctx.from.formatted,
                     note: '从 ' + hub.name + ' 出发，与去程同程' });
            back.start = cursor; back.duration = outDur; back.end = cursor + outDur; back.day = dayNo;
            back.legFromPrev = leg; back.section = 'inter';
            nodes.push(back);
            cursor += outDur;
          } else {
            var dwell = item.kind === 'food' ? ri(60, 90)
                      : item.kind === 'medical' ? ri(40, 70) : ri(90, 150);
            var sn = mkNode(item.kind, item.kind,
              TYPE_META[item.kind].label, item.poi.name, item.poi, poiReal(item.poi));
            sn.start = cursor; sn.duration = dwell; sn.end = cursor + dwell; sn.day = dayNo;
            sn.legFromPrev = leg; sn.section = 'city';
            nodes.push(sn);
            cursor += dwell;
          }
        }

        lastIdx = nodes.length - 1;
        nodes.forEach(function (nd, idx) { nd.index = idx; });
        var totalSpan = nodes[nodes.length - 1].end - (7 * 60 + 30);

        function poiReal(poi) {
          return {
            address: poi.address || '', rating: poi.rating || '',
            tel: poi.tel || '', photo: poi.photo || '',
            type: poi.type ? poi.type.split(';').slice(-1)[0] : ''
          };
        }

        // ---- 9. 文案 ----
        nodes.forEach(function (nd) {
          var real = nd.real || {};
          var dp = DESC_POOL[nd.kind] || DESC_POOL.attraction;
          var tp = TIP_POOL[nd.kind] || TIP_POOL.attraction;
          var flavor = dp[ri(0, dp.length - 1)];
          if (nd.kindCode === 'transport-out' || nd.kindCode === 'transport-back') {
            nd.descBase = (inter
              ? (inter.mode === 'driving' ? '驾车' : '公共交通') + '全程约 ' +
                (inter.distanceKm ? inter.distanceKm + ' 公里，' : '') + fmtDur(nd.duration) + '。'
              : '') + flavor;
          } else {
            var bits = [];
            if (real.type) bits.push(real.type);
            if (real.address) bits.push('地址：' + real.address);
            if (real.rating) bits.push('高德评分 ' + real.rating);
            if (nd.refCost) bits.push('参考人均 ¥' + nd.refCost);
            nd.descBase = (bits.length ? bits.join(' · ') + '。' : '') + flavor;
          }
          // 段信息单独存放，重排路线后能实时反映最新的交通方式与耗时
          nd.desc = nd.descBase;
          nd.tip = tp[ri(0, tp.length - 1)] + (real.tel ? ' 预订电话：' + real.tel : '');

          var cCount = ri(2, 3), usedNames = {};
          nd.comments = [];
          for (var c = 0; c < cCount; c++) {
            var cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
            var guard = 0;
            while (usedNames[cname] && guard++ < 20) cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
            usedNames[cname] = 1;
            nd.comments.push({
              name: cname, rating: ri(4, 5),
              text: COMMENT_TEXTS[ri(0, COMMENT_TEXTS.length - 1)],
              date: '2024-' + pad2(ri(1, 12)) + '-' + pad2(ri(1, 28))
            });
          }
        });

        // ---- 10. 费用分配 ----
        var ratio = 0.88 + (rng() - 0.5) * 0.16;
        ratio = Math.max(0.78, Math.min(0.97, ratio));
        var allocated = Math.round(budget * ratio);
        var interTotal = 0;

        if (inter && inter.refCost > 0) {
          // 驻点漫游：先从预算里扣掉往返城际交通，余额再分给市内住宿/餐饮/景点
          interTotal = Math.min(inter.refCost * 2, Math.round(allocated * 0.7));
          nodes[0].cost = Math.round(interTotal / 2);
          nodes[lastIdx].cost = interTotal - nodes[0].cost;
          var cityNodes = nodes.slice(1, lastIdx);
          var cw = cityNodes.reduce(function (sum, x) { return sum + x.weight; }, 0) || 1;
          var cityPool = Math.max(0, allocated - interTotal);
          var cacc = 0;
          cityNodes.forEach(function (nd, i) {
            if (i === cityNodes.length - 1) nd.cost = Math.max(0, cityPool - cacc);
            else { nd.cost = Math.round(cityPool * nd.weight / cw); cacc += nd.cost; }
          });
          var cc = cityNodes.reduce(function (sum, x) { return sum + x.cost; }, 0);
          if (cc !== cityPool && cityNodes.length) {
            cityNodes[cityNodes.length - 1].cost += (cityPool - cc);
          }
        } else {
          var wSum = nodes.reduce(function (sum, x) { return sum + x.weight; }, 0);
          var acc = 0;
          nodes.forEach(function (nd, idx) {
            if (idx === nodes.length - 1) nd.cost = Math.max(0, allocated - acc);
            else { nd.cost = Math.round(allocated * nd.weight / wSum); acc += nd.cost; }
          });
          var totalCost = nodes.reduce(function (sum, x) { return sum + x.cost; }, 0);
          if (totalCost !== allocated) nodes[nodes.length - 1].cost += (allocated - totalCost);
        }

        return {
          from: from, to: to, budget: budget, duration: duration,
          seed: seed, nodes: nodes, legs: legsOut,
          allocated: allocated, ratio: ratio, totalSpan: totalSpan,
          source: 'amap',
          mode: 'hub',
          scenes: [
            { id: 'inter', label: '路线导航', indices: [0, lastIdx] },
            { id: 'city',  label: '景区漫游', indices: citySceneIndices(lastIdx) }
          ],
          meta: {
            cities: ctx.from.city + ' → ' + ctx.to.city,
            hub: hub.name,
            mode: 'hub',
            cityAdcode: ctx.to.adcode,
            interTotal: interTotal,
            interLeg: {
              mode: inter ? inter.mode : 'transit',
              minutes: outDur,
              km: inter ? inter.distanceKm : 0
            },
            days: days,                 // 聚成的片区数＝实际游览天数
            calDays: Math.floor(nodes[nodes.length - 1].end / 1440) + 1,
            nights: nights,
            radiusKm: radius === Infinity ? 0 : radius,
            approxLegs: approxLegs,
            modes: inter ? inter.mode : ''
          }
        };

        function citySceneIndices(lastI) {
          var a = [];
          for (var i = 1; i <= lastI; i++) a.push(i);
          return a;
        }
      });
    });
  }

  /* =========================================================

  // Catmull-Rom → 三次贝塞尔，得到平滑曲线
  function smoothPath(pts) {
    if (!pts.length) return '';
    if (pts.length === 1) return 'M ' + pts[0].x + ' ' + pts[0].y;
    var d = 'M ' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = pts[i + 2] || p2;
      var c1x = p1.x + (p2.x - p0.x) / 6;
      var c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6;
      var c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ', ' +
                   c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ', ' +
                   p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
    }
    return d;
  }

  var nodeEls = [];

  /* --- 单个地点标记（手绘地图与真实地图共用同一套外观） --- */
  var suppressClick = false;

  // 标签底色分级：景点/餐饮/住宿 → 黄底；交通 → 蓝底；医疗 → 红底
  function badgeClass(kind) {
    if (kind === 'transport') return 'lb-transport';
    if (kind === 'medical') return 'lb-medical';
    return 'lb-hot';
  }
  function badgeWidth(text) {
    var w = 0;
    for (var i = 0; i < text.length; i++) w += text.charCodeAt(i) > 255 ? 11.4 : 6.2;
    return Math.max(30, w + 12);
  }

    }));

    g.addEventListener('keydown', function (ev) {

    });
