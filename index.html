  function makeMoverDot() {
    var g = el('g', {});
    g.appendChild(el('circle', { cx: 0, cy: 0, r: 11, fill: '#3b82f6', opacity: .17 }));
    g.appendChild(el('circle', { cx: 0, cy: 0, r: 5.5, fill: '#3b82f6', stroke: '#ffffff', 'stroke-width': 2 }));
    return g;
  }

  // 路线分四层画：外发光 → 柔光带 → 实线 → 循环流动的高光虚线
  function makeRouteLayers(d) {
    var mk = function (cls, attrs) {
      var a = { class: cls, d: d, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
      for (var k in attrs) a[k] = attrs[k];
      return el('path', a);
    };
    var glow = mk('route-glow', { stroke: '#3b82f6', 'stroke-width': 13, opacity: .16 });
    var soft = mk('route-soft', { stroke: '#60a5fa', 'stroke-width': 6, opacity: .32 });
    var line = mk('route-line', { stroke: '#2563eb', 'stroke-width': 2.6 });
    var flow = mk('route-flow', { stroke: '#dbeafe', 'stroke-width': 2.6, 'stroke-dasharray': '16 96' });
    var g = el('g', {});
    g.appendChild(glow);
    g.appendChild(soft);
    g.appendChild(line);
    g.appendChild(flow);
    return { group: g, glow: glow, soft: soft, line: line, flow: flow };
  }

  // 折线上按比例取点，同时给出该处的前进方向角（用于方向箭头）
  function polyPointAt(pts, f) {
    if (!pts || pts.length < 2) return null;
    var segs = [], total = 0, i;
    for (i = 0; i < pts.length - 1; i++) {
      var dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y;
      var len = Math.sqrt(dx * dx + dy * dy);
      segs.push(len); total += len;
    }
    if (!(total > 0)) return null;
    var target = total * f, acc = 0;
    for (i = 0; i < segs.length; i++) {
      if (acc + segs[i] >= target || i === segs.length - 1) {
        var t = segs[i] > 0 ? Math.max(0, Math.min(1, (target - acc) / segs[i])) : 0;
        var a = pts[i], b = pts[i + 1];
        return {
          x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t,
          angle: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI,
          total: total
        };
      }
      acc += segs[i];
    }
    return null;
  }

  function modeLabel(mode) {
    return mode === 'walking' ? '步行'
         : mode === 'bicycling' ? '骑行'
         : mode === 'driving' ? '驾车'
         : mode === 'subway' ? '地铁'
         : mode === 'bus' ? '公交'
         : mode === 'ferry' ? '轮渡'
         : mode === 'transit' ? '公交地铁'
         : '移动';
  }

  // 城际交通用弧线表示（两点间没有市内路网，画直线太干）
  function arcPolyline(a, b, bulge) {
    var pts = [];
    var mx = (a.lng + b.lng) / 2, my = (a.lat + b.lat) / 2;
    var cx = mx - (b.lat - a.lat) * bulge, cy = my + (b.lng - a.lng) * bulge;
    for (var i = 0; i <= 40; i++) {
      var t = i / 40;
      pts.push({
        lng: (1 - t) * (1 - t) * a.lng + 2 * (1 - t) * t * cx + t * t * b.lng,
        lat: (1 - t) * (1 - t) * a.lat + 2 * (1 - t) * t * cy + t * t * b.lat
      });
    }
    return pts;
  }
  function polyToPath(scr) {
    var d = '';
    for (var i = 0; i < scr.length; i++) {
      d += (d ? ' L ' : 'M ') + scr[i].x.toFixed(1) + ' ' + scr[i].y.toFixed(1);
    }
    return d;
  }
  function legText(leg) {
    if (!leg) return '';
    return modeLabel(leg.mode) + ' ' + fmtDur(leg.minutes) + (leg.approx ? '(估)' : '');
  }

  // 路段标注：箭头 + 交通方式/耗时
  function makeLegMarker(leg) {
    var g = el('g', { class: 'leg-mark' });
    var rot = el('g', { class: 'leg-rot' });
    rot.appendChild(el('path', { class: 'leg-arrow', d: 'M -5.5 -4.5 L 7 0 L -5.5 4.5 z' }));
    g.appendChild(rot);

    txt.textContent = legText(leg);
    g.appendChild(txt);
    return { g: g, rot: rot, text: txt };
  }

  /* --- 手绘地图的缩放 / 平移（在 viewBox 坐标里做仿射变换） --- */
  var svgRoot = null;
  var svgView = { k: 1, x: 0, y: 0 };

  function applySvgView() {
    if (!svgRoot) return;
    svgRoot.setAttribute('transform',
      'translate(' + svgView.x.toFixed(2) + ',' + svgView.y.toFixed(2) + ') scale(' + svgView.k.toFixed(4) + ')');
  }
  function resetSvgView() { svgView = { k: 1, x: 0, y: 0 }; applySvgView(); }
  function svgEventPoint(ev) {
    var r = svg.getBoundingClientRect();
    var s = (r.width / 900) || 1;
    return { x: (ev.clientX - r.left) / s, y: (ev.clientY - r.top) / s };

  // 以 (px,py) 为锚点缩放，保证该点在屏幕上不动
  function svgZoomAt(nk, px, py) {
    nk = Math.max(0.5, Math.min(8, nk));
    var k = svgView.k;
    if (Math.abs(nk - k) < 1e-6) return;
    svgView.x = px - (px - svgView.x) * (nk / k);
    svgView.y = py - (py - svgView.y) * (nk / k);
    svgView.k = nk;
    applySvgView();
  }

  function drawMap(plan) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    nodeEls = [];
    routePath = null;
    routeLen = 0;
    svgView = { k: 1, x: 0, y: 0 };

    svgRoot = el('g', { id: 'svgRoot' });
    svgRoot.appendChild(drawDecor());

    // 路线
    var pts = plan.nodes.map(function (n) {
      return {
        x: (typeof n.x === 'number' && isFinite(n.x)) ? n.x : 450,
        y: (typeof n.y === 'number' && isFinite(n.y)) ? n.y : 310
      };
    });
    var d = smoothPath(pts);

    // 路线：发光实线 + 流光
    var route = makeRouteLayers(d);
    routePath = route.line;
    svgRoot.appendChild(route.group);

    // 路段中点：方向箭头 + 交通方式/耗时
    var legLayer = el('g', {});
    for (var li = 1; li < plan.nodes.length; li++) {
      var pa = plan.nodes[li - 1], pb = plan.nodes[li];
      var ax = (typeof pa.x === 'number' && isFinite(pa.x)) ? pa.x : 450;
      var ay = (typeof pa.y === 'number' && isFinite(pa.y)) ? pa.y : 310;
      var bx = (typeof pb.x === 'number' && isFinite(pb.x)) ? pb.x : 450;
      var by = (typeof pb.y === 'number' && isFinite(pb.y)) ? pb.y : 310;
      var mid = polyPointAt([{ x: ax, y: ay }, { x: bx, y: by }], .5);
      if (!mid) continue;
      var mk = makeLegMarker(pb.legFromPrev);
      if (!pb.legFromPrev) mk.text.textContent = '';
      mk.g.setAttribute('transform', 'translate(' + mid.x.toFixed(1) + ',' + mid.y.toFixed(1) + ')');
      mk.rot.setAttribute('transform', 'rotate(' + mid.angle.toFixed(1) + ')');
      legLayer.appendChild(mk.g);
    }
    svgRoot.appendChild(legLayer);

    // 移动光点
    mover = makeMoverDot();
    svgRoot.appendChild(mover);

    // 节点
    var nodeLayer = el('g', {});
    plan.nodes.forEach(function (nd) {
      var g = makeNodeGroup(nd);
      var px = (typeof nd.x === 'number' && isFinite(nd.x)) ? nd.x : 450;
      var py = (typeof nd.y === 'number' && isFinite(nd.y)) ? nd.y : 310;
      g.setAttribute('transform', 'translate(' + px.toFixed(1) + ',' + py.toFixed(1) + ')');
      nodeLayer.appendChild(g);
      nodeEls.push(g);
    });
    svgRoot.appendChild(nodeLayer);

    svg.appendChild(svgRoot);
    applySvgView();

    // 重新计算路径长度
    try { routeLen = routePath.getTotalLength(); } catch (e) { routeLen = 0; }
    moverT = 0;
  }

  /* =========================================================
   * 5. 动画：沿路径移动的小圆点
   * =======================================================*/
  var lastTs = 0;
  function tick(ts) {
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (routePath && routeLen > 0 && mover) {
      moverT += (58 / routeLen) * dt;   // 约 58 px / 秒
      if (moverT > 1) moverT -= 1;
      try {
        var p = routePath.getPointAtLength(moverT * routeLen);
        mover.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ')');
      } catch (e) { /* 路径尚未就绪，跳过该帧 */ }
    }
    window.requestAnimationFrame(tick);
  }
  window.requestAnimationFrame(tick);

  /* =========================================================
   * 5.5 真实瓦片地图：自研 Web Mercator 瓦片引擎
   *     —— 无任何地图库依赖，缩放手势完全自实现
   * =======================================================*/
  var tileMapEl = document.getElementById('tileMap');
  var tileLayerEl = document.getElementById('tileLayer');
  var tileOverlayEl = document.getElementById('tileOverlay');
  var scaleBarEl = document.getElementById('scaleBar');

  var tileView = { zoom: 10, nx: 0.5, ny: 0.5 };
  var tilePlan = null;
  var tileEls = [];
  var tileRouteHalo = null;
  var tileRoutePath = null;
  var tileRouteSoft = null;
  var tileRouteFlow = null;
  var tileMover = null;
  var legMarks = [];
  var tileIdx = [];
  var mapScene = 'city';
  var tileCache = {};
  var tileActive = false;
  // 底图图层：ltype=1 只保留地块（去掉铁路/高速/POI 注记），3=地块+路网，8=纯色，0=标准
  var LS_LTYPE = 'jp.tileLtype.v1';
  var tileLtype = 1;

  // WGS-84 与 GCJ-02 在一张瓦片图上的投影公式相同，
  // 高德瓦片本身就是 GCJ-02 基准，所以高德 POI 坐标可以直接套用，无需纠偏。
  function lngToNormX(lng) { return (lng + 180) / 360; }
  function latToNormY(lat) {
    var s = Math.sin(lat * Math.PI / 180);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  }
  function normYToLat(ny) {
    var n = Math.PI - 2 * Math.PI * ny;
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }
  function tileUrl(x, y, z) {
    var sub = ((x + y) % 4) + 1;
    return 'https://wprd0' + sub + '.is.autonavi.com/appmaptile' +
           '?lang=zh_cn&size=1&style=7&x=' + x + '&y=' + y + '&z=' + z +
           (tileLtype ? '&ltype=' + tileLtype : '');
  }
  function clearTiles() {
    for (var k in tileCache) {
      if (tileCache[k].parentNode) tileCache[k].parentNode.removeChild(tileCache[k]);
    }
    tileCache = {};
  }
  function tileDims() {
    return { w: tileMapEl.clientWidth || 900, h: tileMapEl.clientHeight || 620 };
  }
  function worldSize(z) { return 256 * Math.pow(2, z); }

  function lngLatToScreen(lng, lat, w, h) {
    var S = worldSize(tileView.zoom);
    return {
      x: (lngToNormX(lng) - tileView.nx) * S + w / 2,
      y: (latToNormY(lat) - tileView.ny) * S + h / 2
    };
  }

  // 限制视野不越出世界范围，避免拖出大片空白
  function clampTileView() {
    var d = tileDims();
    var S = worldSize(tileView.zoom);
    var halfW = (d.w / 2) / S, halfH = (d.h / 2) / S;
    if (halfW >= 0.5) tileView.nx = 0.5;
    else tileView.nx = Math.max(halfW, Math.min(1 - halfW, tileView.nx));
    if (halfH >= 0.5) tileView.ny = 0.5;
    else tileView.ny = Math.max(halfH, Math.min(1 - halfH, tileView.ny));
  }

  function renderTiles() {
    if (!tileActive) return;
    var d = tileDims(), w = d.w, h = d.h;
    var tz = Math.max(3, Math.min(18, Math.round(tileView.zoom)));
    var s = Math.pow(2, tileView.zoom - tz);        // 亚级缩放，保证连续
    var S = worldSize(tz);
    var vx = tileView.nx * S, vy = tileView.ny * S;

    tileLayerEl.style.transform =
      'translate(' + (-vx * s + w / 2).toFixed(2) + 'px,' + (-vy * s + h / 2).toFixed(2) + 'px) scale(' + s.toFixed(4) + ')';

    var PAD = 256;                                   // 四周多载一圈，拖动时不闪白
    var minX = vx - (w / 2 + PAD) / s, maxX = vx + (w / 2 + PAD) / s;
    var minY = vy - (h / 2 + PAD) / s, maxY = vy + (h / 2 + PAD) / s;
    var n = Math.pow(2, tz);
    var x0 = Math.floor(minX / 256), x1 = Math.floor(maxX / 256);
    var y0 = Math.max(0, Math.floor(minY / 256)), y1 = Math.min(n - 1, Math.floor(maxY / 256));
    if (x1 - x0 > 40) x1 = x0 + 40;

    var need = {};
    for (var xi = x0; xi <= x1; xi++) {
      var wx = ((xi % n) + n) % n;
      for (var yi = y0; yi <= y1; yi++) {
        var key = tz + '/' + xi + '/' + yi;
        need[key] = 1;
        if (!tileCache[key]) {
          var img = document.createElement('img');
          img.alt = '';
          img.decoding = 'async';
          img.style.left = (xi * 256) + 'px';
          img.style.top = (yi * 256) + 'px';
          img.src = tileUrl(wx, yi, tz);
          tileCache[key] = img;
          tileLayerEl.appendChild(img);
        }
      }
    }
    for (var k in tileCache) {
      if (!need[k]) {
        if (tileCache[k].parentNode) tileCache[k].parentNode.removeChild(tileCache[k]);
        delete tileCache[k];
      }
    }
  }

  function renderTileOverlay() {
    if (!tileActive || !tilePlan) return;
    var d = tileDims(), w = d.w, h = d.h;
    tileOverlayEl.setAttribute('width', w);
    tileOverlayEl.setAttribute('height', h);
    tileOverlayEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

    var pts = [];
    tileIdx.forEach(function (ni, k) {
      var nd = tilePlan.nodes[ni];
      if (!nd) { pts.push({ x: 0, y: 0 }); return; }
      var p = lngLatToScreen(nd.lng, nd.lat, w, h);
      pts.push(p);
      if (tileEls[k]) {
        tileEls[k].setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')');
      }
    });

    // 路线永远与「当前视图里能看到的段」一致
    var path = '';
    legMarks.forEach(function (m) {
      var scr = (m.poly || []).map(function (p) { return lngLatToScreen(p.lng, p.lat, w, h); });
      if (scr.length >= 2) path += polyToPath(scr);
    });
    if (!path) path = smoothPath(pts);

    if (tileRouteHalo) tileRouteHalo.setAttribute('d', path);
    if (tileRouteSoft) tileRouteSoft.setAttribute('d', path);
    if (tileRouteFlow) tileRouteFlow.setAttribute('d', path);
    if (tileRoutePath) {
      tileRoutePath.setAttribute('d', path);
      try { routeLen = tileRoutePath.getTotalLength(); } catch (e) { routeLen = 0; }
    }

    // 路段中点：方向箭头 + 交通方式/耗时（过短的段不标注，避免堆叠）
    legMarks.forEach(function (m) {
      var scr = (m.poly || []).map(function (p) { return lngLatToScreen(p.lng, p.lat, w, h); });
      var pt = polyPointAt(scr, 0.52);
      if (!pt || pt.total < 52) {
        m.g.setAttribute('transform', 'translate(-9999,-9999)');
        return;
      }
      m.g.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')');
      m.rot.setAttribute('transform', 'rotate(' + pt.angle.toFixed(1) + ')');
    });

    applyDeclutter(pts);

    updateScaleBar();
  }

  // 节点抽稀：屏幕距离过近时，保留优先级高的，其余降级（缩小 + 隐藏标签）
  function nodePriority(nd) {
    if (!nd) return 0;
    if (nd.kind === 'transport') return 5;
    if (nd.kind === 'lodging') return 4;
    if (nd.kind === 'attraction') return 3;
    if (nd.kind === 'food') return 2;
    return 1;
  }
  function applyDeclutter(pts) {
    var order = pts.map(function (p, i) { return i; });
    order.sort(function (a, b) {
      var d = nodePriority(tilePlan.nodes[tileIdx[b]]) - nodePriority(tilePlan.nodes[tileIdx[a]]);
      return d !== 0 ? d : a - b;
    });
    var kept = [], minor = {};
    order.forEach(function (i) {
      var p = pts[i], clash = false;
      for (var k = 0; k < kept.length; k++) {
        var q = pts[kept[k]];
        if (Math.abs(p.x - q.x) < 32 && Math.abs(p.y - q.y) < 24) { clash = true; break; }
      }
      if (clash) minor[i] = 1; else kept.push(i);
    });
    tileEls.forEach(function (g, i) { g.classList.toggle('minor', !!minor[i]); });
  }

  function updateScaleBar() {
    if (!scaleBarEl) return;
    var mpp = 156543.03392 * Math.cos(normYToLat(tileView.ny) * Math.PI / 180) / Math.pow(2, tileView.zoom);
    var steps = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000];
    var target = mpp * 96, pick = steps[0];
    for (var i = 0; i < steps.length; i++) if (steps[i] <= target) pick = steps[i];
    var px = Math.max(28, Math.min(190, pick / mpp));
    var bar = scaleBarEl.querySelector ? scaleBarEl.querySelector('i') : null;
    var txt = scaleBarEl.querySelector ? scaleBarEl.querySelector('span') : null;
    if (bar) bar.style.width = px.toFixed(0) + 'px';
    if (txt) txt.textContent = pick >= 1000 ? (pick / 1000) + ' 公里' : pick + ' 米';
  }

  // 视图分场景：驻点漫游下分「城际交通」与「市内游览」两段
  function sceneIndices(plan, sceneId) {
    if (plan && plan.scenes && sceneId) {
      for (var i = 0; i < plan.scenes.length; i++) {
        if (plan.scenes[i].id === sceneId) return plan.scenes[i].indices;
      }
    }
    return null;
  }

  function buildTileOverlay(plan, sceneId) {
    while (tileOverlayEl.firstChild) tileOverlayEl.removeChild(tileOverlayEl.firstChild);
    tileEls = [];
    legMarks = [];
    tilePlan = plan;

    var idxs = sceneIndices(plan, sceneId);
    if (!idxs) idxs = plan.nodes.map(function (_, i) { return i; });
    tileIdx = idxs;

    var route = makeRouteLayers('');
    tileRouteHalo = route.glow;
    tileRouteSoft = route.soft;
    tileRoutePath = route.line;
    tileRouteFlow = route.flow;
    tileOverlayEl.appendChild(route.group);

    // 路段标注层（在路线之上、节点之下）
    var legLayer = el('g', {});
    var interInfo = (plan.meta && plan.meta.interLeg) || { mode: 'transit', minutes: 0, km: 0 };
    for (var k = 0; k + 1 < idxs.length; k++) {
      var fromI = idxs[k], toI = idxs[k + 1];
      var a = plan.nodes[fromI], b = plan.nodes[toI];
      if (!a || !b) continue;
      var poly, leg;
      if (sceneId === 'inter') {
        // 城际段没有市内路网，用弧线表示
        poly = arcPolyline(a, b, 0.16);
        leg = { mode: interInfo.mode, minutes: interInfo.minutes, km: interInfo.km, approx: true };
      } else {
        poly = (plan.legs || [])[fromI];
        leg = b.legFromPrev;
      }
      if (!poly || poly.length < 2) continue;
      var m = makeLegMarker(leg || { mode: '', minutes: 0 });
      m.poly = poly;
      legLayer.appendChild(m.g);
      legMarks.push(m);
    }
    tileOverlayEl.appendChild(legLayer);

    tileMover = makeMoverDot();
    tileOverlayEl.appendChild(tileMover);

    var nodeLayer = el('g', {});
    idxs.forEach(function (ni) {
      var g = makeNodeGroup(plan.nodes[ni]);
      nodeLayer.appendChild(g);
      tileEls.push(g);
    });
    tileOverlayEl.appendChild(nodeLayer);

    // 把动画循环的驱动对象切到真实地图上
    routePath = tileRoutePath;
    mover = tileMover;
    routeLen = 0;
    moverT = 0;
  }

  // 自动取景：让当前视图的节点刚好铺满可视区
  function fitTileView(plan, idxs) {
    var d = tileDims(), w = d.w, h = d.h;
    var list = idxs ? idxs.map(function (i) { return plan.nodes[i]; }) : plan.nodes;
    var xs = [], ys = [];
    list.forEach(function (nd) {
      if (nd && typeof nd.lng === 'number' && typeof nd.lat === 'number' &&
          isFinite(nd.lng) && isFinite(nd.lat)) {
        xs.push(lngToNormX(nd.lng));
        ys.push(latToNormY(nd.lat));
      }
    });
    if (!xs.length) return;
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var availW = Math.max(80, w - 210);      // 给标签和工具条留位置
    var availH = Math.max(80, h - 180);
    var spanX = maxX - minX, spanY = maxY - minY;
    tileView.nx = (minX + maxX) / 2;
    tileView.ny = (minY + maxY) / 2;

    // 所有点几乎重合时不要一路放大到 17 级，否则整张图只剩一个点
    if (spanX < 1e-6 && spanY < 1e-6) {
      tileView.zoom = 14;
      clampTileView();
      return;
    }
    var zx = Math.log(availW / (256 * Math.max(spanX, 1e-7))) / Math.LN2;
    var zy = Math.log(availH / (256 * Math.max(spanY, 1e-7))) / Math.LN2;
    tileView.zoom = Math.max(3, Math.min(16, Math.min(zx, zy)));
    clampTileView();
  }

  // 两种地图的显隐：用 data-mode 属性 + hidden 属性双保险。
  // 不能只写 node.hidden —— <svg> 上没有这个 IDL 属性，赋了也不会生效。
  var mapWrapEl = document.querySelector('.map-wrap');
  var mapMode = 'svg';

  function setHidden(node, on) {
    if (!node) return;
    if (on) node.setAttribute('hidden', '');
    else node.removeAttribute('hidden');
  }
  function setMapMode(mode) {
    mapMode = mode;
    if (mapWrapEl) mapWrapEl.setAttribute('data-mode', mode);
  }

  function showTileMap(plan, sceneId) {
    tileActive = true;
    setMapMode('tile');
    setHidden(tileMapEl, false);
    setHidden(svg, true);
    setHidden(scaleBarEl, false);
    setHidden(document.getElementById('tileSeg'), false);
    // 只有驻点漫游才分城际/市内两个视图
    setHidden(document.getElementById('sceneSwitch'), !(plan && plan.scenes));

    // 换路线时清掉旧瓦片，避免残留
    clearTiles();

    var idxs = sceneIndices(plan, sceneId);
    buildTileOverlay(plan, sceneId);
    fitTileView(plan, idxs);
    renderTiles();
    renderTileOverlay();
    // 容器尺寸在下一帧才稳定，补渲染一次
    window.setTimeout(function () {
      if (tileActive) { renderTiles(); renderTileOverlay(); }
    }, 0);
  }

  function hideTileMap() {
    tileActive = false;
    setMapMode('svg');
    setHidden(tileMapEl, true);
    setHidden(svg, false);
    setHidden(scaleBarEl, true);
    setHidden(document.getElementById('tileSeg'), true);
    setHidden(document.getElementById('sceneSwitch'), true);
  }

  // 以视口内某点为锚点缩放（滚轮 / 按钮 / 双击共用）
  function tileZoomAt(nz, mx, my) {
    var d = tileDims(), w = d.w, h = d.h;
    nz = Math.max(3, Math.min(18, nz));
    var S0 = worldSize(tileView.zoom);
    var ux = tileView.nx + (mx - w / 2) / S0;
    var uy = tileView.ny + (my - h / 2) / S0;
    tileView.zoom = nz;
    var S1 = worldSize(nz);
    tileView.nx = ux - (mx - w / 2) / S1;
    tileView.ny = uy - (my - h / 2) / S1;
    clampTileView();
    renderTiles();
    renderTileOverlay();
  }

  function zoomBy(step) {
    if (tileActive) {
      var d = tileDims();
      tileZoomAt(tileView.zoom + step, d.w / 2, d.h / 2);
    } else {
      svgZoomAt(svgView.k * Math.pow(1.4, step), 450, 310);
    }
  }

  /* --- 拖拽平移 --- */
  // 拖拽监听挂在 window 上而不是用 setPointerCapture：
  // 后者在部分浏览器里会把 click 重定向到容器，导致地点点击失效。
  var tileDrag = null;
  function onTileDragMove(ev) {
    if (!tileDrag) return;
    var S = worldSize(tileView.zoom);
    tileDrag.moved = Math.max(tileDrag.moved,
      Math.abs(ev.clientX - tileDrag.x) + Math.abs(ev.clientY - tileDrag.y));
    tileView.nx = tileDrag.nx - (ev.clientX - tileDrag.x) / S;
    tileView.ny = tileDrag.ny - (ev.clientY - tileDrag.y) / S;
    clampTileView();
    renderTiles();
    renderTileOverlay();
  }
  function onTileDragEnd() {
    window.removeEventListener('pointermove', onTileDragMove);
    window.removeEventListener('pointerup', onTileDragEnd);
    window.removeEventListener('pointercancel', onTileDragEnd);
    if (!tileDrag) return;
    // 位移超过 4px 视为平移，屏蔽随之而来的 click
    if (tileDrag.moved > 4) {
      suppressClick = true;
      window.setTimeout(function () { suppressClick = false; }, 0);
    }
    tileDrag = null;
    tileMapEl.classList.remove('dragging');
  }
  tileMapEl.addEventListener('pointerdown', function (ev) {
    if (ev.button !== undefined && ev.button !== 0) return;
    tileDrag = { x: ev.clientX, y: ev.clientY, nx: tileView.nx, ny: tileView.ny, moved: 0 };
    suppressClick = false;
    tileMapEl.classList.add('dragging');
    window.addEventListener('pointermove', onTileDragMove);
    window.addEventListener('pointerup', onTileDragEnd);
    window.addEventListener('pointercancel', onTileDragEnd);
  });

  tileMapEl.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var r = tileMapEl.getBoundingClientRect();
    var dz = -ev.deltaY * 0.0035;
    dz = Math.max(-0.6, Math.min(0.6, dz));
    tileZoomAt(tileView.zoom + dz, ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  tileMapEl.addEventListener('dblclick', function () {
    if (!tilePlan) return;
    fitTileView(tilePlan);
    renderTiles();
    renderTileOverlay();
  });

  /* --- 手绘地图上的同款手势 --- */
  var svgDrag = null;
  function onSvgDragMove(ev) {
    if (!svgDrag) return;
    svgDrag.moved = Math.max(svgDrag.moved,
      Math.abs(ev.clientX - svgDrag.x) + Math.abs(ev.clientY - svgDrag.y));
    svgView.x = svgDrag.vx + (ev.clientX - svgDrag.x) / svgDrag.scale;
    svgView.y = svgDrag.vy + (ev.clientY - svgDrag.y) / svgDrag.scale;
    applySvgView();
  }
  function onSvgDragEnd() {
    window.removeEventListener('pointermove', onSvgDragMove);
    window.removeEventListener('pointerup', onSvgDragEnd);
    window.removeEventListener('pointercancel', onSvgDragEnd);
    if (!svgDrag) return;
    if (svgDrag.moved > 4) {
      suppressClick = true;
      window.setTimeout(function () { suppressClick = false; }, 0);
    }
    svgDrag = null;
    svg.classList.remove('dragging');
  }
  svg.addEventListener('pointerdown', function (ev) {
    if (ev.button !== undefined && ev.button !== 0) return;
    if (mapMode !== 'svg') return;
    svgDrag = { x: ev.clientX, y: ev.clientY, vx: svgView.x, vy: svgView.y, moved: 0,
                scale: (svg.getBoundingClientRect().width / 900) || 1 };
    suppressClick = false;
    svg.classList.add('dragging');
    window.addEventListener('pointermove', onSvgDragMove);
    window.addEventListener('pointerup', onSvgDragEnd);
    window.addEventListener('pointercancel', onSvgDragEnd);
  });

  svg.addEventListener('wheel', function (ev) {
    if (mapMode !== 'svg') return;
    ev.preventDefault();
    var p = svgEventPoint(ev);
    svgZoomAt(svgView.k * Math.pow(1.0016, -ev.deltaY), p.x, p.y);
  }, { passive: false });

  svg.addEventListener('dblclick', function () { if (mapMode === 'svg') resetSvgView(); });

  /* --- 工具条 --- */
  document.getElementById('zoomIn').addEventListener('click', function () { zoomBy(1); });
  document.getElementById('zoomOut').addEventListener('click', function () { zoomBy(-1); });
  document.getElementById('zoomFit').addEventListener('click', function () {
    if (tileActive && tilePlan) {
      fitTileView(tilePlan);
      renderTiles();
      renderTileOverlay();
      toast('已适应路线范围');
    } else {
      resetSvgView();
      toast('已复位');
    }
  });

  window.addEventListener('resize', function () {
    if (tileActive) { renderTiles(); renderTileOverlay(); }
  });

  /* =========================================================
   * 6. 详情面板 & 时间轴渲染
   * =======================================================*/
  var detailBody = document.getElementById('detailBody');
  var timelineEl = document.getElementById('timeline');

  function stars(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }

  function renderEmptyDetail() {
    detailBody.innerHTML =
      '<div class="detail-empty"><span class="big">🗺️</span>点击地图上的地点查看详情</div>';
  }

  function renderDetail(nd) {
    var html = '';
    html += '<div class="detail-card">';
    html += '  <div class="dc-top">';
    html += '    <div class="dc-icon" style="background:' + nd.color + '1a;border-color:' + nd.color + '55">' + nd.icon + '</div>';
    html += '    <div class="dc-title">';
    html += '      <span class="dc-type" style="color:' + nd.color + ';background:' + nd.color + '1a">' + nd.typeLabel + '</span>';
    html += '      <div class="dc-name">' + esc(nd.name) + '</div>';
    html += '    </div>';
    html += '  </div>';

    html += '  <div class="meta-grid">';
    html += '    <div class="meta-item"><b>时间</b><span>' + fmtTime(nd.start) + '</span></div>';
    html += '    <div class="meta-item"><b>时长</b><span>' + fmtDur(nd.duration) + '</span></div>';
    html += '    <div class="meta-item"><b>费用</b><span style="color:' + nd.color + ';font-weight:650">' + yuan(nd.cost) + '</span></div>';
    html += '    <div class="meta-item"><b>序号</b><span>第 ' + (nd.index + 1) + ' 站</span></div>';
    html += '  </div>';

    // 真实数据来源的补充信息（仅高德模式下存在）
    if (nd.real && (nd.real.note || nd.real.address || nd.real.rating || nd.real.tel || nd.refCost)) {
      html += '  <div class="sec-title">实时信息 · 高德</div>';
      html += '  <div class="real-box">';
      if (nd.real.note) html += '<div>🧭 ' + esc(nd.real.note) + '</div>';
      if (nd.real.address) html += '<div>📍 ' + esc(nd.real.address) + '</div>';
      if (nd.real.type) html += '<div>🏷️ ' + esc(nd.real.type) + '</div>';
      if (nd.real.rating) html += '<div>⭐ 高德评分 ' + esc(nd.real.rating) + '</div>';
      if (nd.refCost) html += '<div>💰 参考人均 ¥' + esc(nd.refCost) + '</div>';
      if (nd.real.tel) html += '<div>☎️ ' + esc(nd.real.tel) + '</div>';
      html += '  </div>';
    }

    // 到上一站的交通方式与耗时（重排后自动刷新）
    if (nd.legFromPrev) {
      html += '  <div class="sec-title">从上一站</div>';
      html += '  <div class="real-box">' +
                '<div>🚏 ' + esc(legText(nd.legFromPrev)) +
                (nd.legFromPrev.km ? ' · ' + nd.legFromPrev.km.toFixed(1) + ' 公里' : '') +
                (nd.legFromPrev.approx ? ' · 估算值' : ' · 高德路径规划') + '</div>' +
              '</div>';
    }

    html += '  <div class="sec-title">行程描述</div>';
    html += '  <div class="dc-desc">' + esc(nd.descBase || nd.desc) + '</div>';

    html += '  <div class="sec-title">小贴士</div>';
    html += '  <div class="tip-box">💡 ' + esc(nd.tip) + '</div>';

    html += '  <div class="sec-title">旅友评论 · ' + nd.comments.length + ' 条</div>';
    nd.comments.forEach(function (c) {
      html += '<div class="comment">';
      html += '  <div class="avatar">' + esc(c.name.slice(0, 2)) + '</div>';
      html += '  <div class="cm-body">';
      html += '    <div class="cm-head"><span class="cm-name">' + esc(c.name) + '</span><span class="cm-stars">' + stars(c.rating) + '</span></div>';
      html += '    <div class="cm-text">' + esc(c.text) + '</div>';
      html += '    <div class="cm-date">' + esc(c.date) + '</div>';
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';
    detailBody.innerHTML = html;
  }

  function renderTimeline(plan) {
    timelineEl.innerHTML = '';
    timelineEl.classList.remove('reordering');
    var sumEl = document.getElementById('tlSum');
    if (sumEl) sumEl.innerHTML = '';
    var groups;
    if (plan.scenes) {
      // 驻点漫游：时间轴分「路线导航」（去程+返程）与「景区漫游」（按天）两段
      var inter = [], city = [];
      plan.nodes.forEach(function (nd) { (nd.section === 'inter' ? inter : city).push(nd); });
      groups = [{ label: '路线导航', nodes: inter }, { label: '景区漫游', nodes: city }];
    } else {
      groups = [{ label: null, nodes: plan.nodes }];
    }

    var travelMin = 0, stayMin = 0;
    var modeMin = {};

    groups.forEach(function (grp) {
      if (!grp.nodes.length) return;
      if (grp.label) {
        var sh = document.createElement('div');
        sh.className = 'tl-section';
        sh.textContent = grp.label;
        timelineEl.appendChild(sh);
      }
      var lastDay = null;
      grp.nodes.forEach(function (nd) {
        // 跨天时插入一个日期分隔条（天数直接由起始分钟推导，模拟/真实数据通用）
        var day = nd.day || (Math.floor((nd.start || 0) / 1440) + 1);
        if (day !== lastDay) {
          var sep = document.createElement('div');
          sep.className = 'tl-day';
          sep.textContent = '第 ' + day + ' 天';
          timelineEl.appendChild(sep);
          lastDay = day;
        }

        // 每张卡片连同它前面的「怎么过去」组成一个可拖拽的组
        var wrap = document.createElement('div');
        wrap.className = 'tl-group';
        wrap.setAttribute('data-index', String(nd.index));
        wrap.setAttribute('data-section', nd.section || 'city');

        if (nd.legFromPrev) {
          var leg = nd.legFromPrev;
          var lw = document.createElement('div');
          lw.className = 'tl-leg';
          lw.innerHTML = '<span class="tl-leg-arrow">→</span>' +
                         '<span class="tl-leg-lbl">' + esc(legText(leg)) + '</span>' +
                         (leg.km ? '<span class="tl-leg-km">' + leg.km.toFixed(1) + ' km</span>' : '');
          wrap.appendChild(lw);
          travelMin += leg.minutes || 0;
          modeMin[leg.mode] = (modeMin[leg.mode] || 0) + (leg.minutes || 0);
        }

        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'tl-card';
        card.style.borderLeftColor = nd.color;
        card.dataset.index = String(nd.index);
        card.innerHTML =
          '<div class="tl-time">' + fmtTime(nd.start) + '</div>' +
          '<div class="tl-name">' + nd.icon + ' ' + esc(nd.name) + '</div>' +
          '<div class="tl-cost" style="color:' + nd.color + '">' + yuan(nd.cost) + '</div>' +
          '<div class="tl-stay">停留 ' + fmtDur(nd.duration) + '</div>';
        card.addEventListener('click', function () {
          if (!suppressClick) select(nd.index);
        });
        wrap.appendChild(card);
        timelineEl.appendChild(wrap);
        nd.cardEl = card;
        nd.groupEl = wrap;

        if (nd.kindCode !== 'transport-out' && nd.kindCode !== 'transport-back') {
          stayMin += nd.duration || 0;
        }
      });
    });

    // 在途 / 停留分开统计，避免把「游览时间」误当成「路上时间」
    var modeParts = ['walking', 'bicycling', 'transit', 'driving']
      .filter(function (m) { return modeMin[m]; })
      .map(function (m) { return modeLabel(m) + ' ' + fmtDur(modeMin[m]); });

    // 汇总条是滚动行之外的普通块级元素，不参与横向布局
    if (sumEl) {
      sumEl.innerHTML = '<b>在途合计</b> ' + fmtDur(travelMin) +
                        '　·　<b>停留合计</b> ' + fmtDur(stayMin) +
                        (modeParts.length ? '　·　<b>交通构成</b> ' + modeParts.join(' · ') : '');
    }
  }

  function scrollCardIntoView(card) {
    var target = card.offsetLeft - timelineEl.clientWidth / 2 + card.clientWidth / 2;
    if (typeof timelineEl.scrollTo === 'function') {
      timelineEl.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    } else {
      timelineEl.scrollLeft = Math.max(0, target);
    }
  }

  /* =========================================================
   * 7. 状态与交互
   * =======================================================*/
  var state = { plan: null, selected: -1 };

  function select(index) {
    var plan = state.plan;
    if (!plan) return;
    var nd = plan.nodes[index];
    if (!nd) return;
    state.selected = index;

    nodeEls.forEach(function (g, i) { g.classList.toggle('active', i === index); });
    tileEls.forEach(function (g, i) { g.classList.toggle('active', i === index); });
    plan.nodes.forEach(function (n) {
      if (n.cardEl) n.cardEl.classList.toggle('active', n.index === index);
    });

    renderDetail(nd);
    if (nd.cardEl) scrollCardIntoView(nd.cardEl);
  }

  function renderBudget(plan) {
    var pct = Math.round(plan.ratio * 100);
    var warn = plan.ratio > 0.9;
    var fill = document.getElementById('barFill');
    fill.style.width = Math.min(100, pct) + '%';
    fill.classList.toggle('warn', warn);
    document.getElementById('budgetAmt').textContent = yuan(plan.allocated) + ' / ' + yuan(plan.budget);
    var note = document.getElementById('budgetNote');
    note.textContent = '已分配 ' + pct + '% · 剩余 ' + yuan(plan.budget - plan.allocated) +
                       (warn ? '（预算偏紧，建议留出浮动）' : '');
    note.classList.toggle('warn', warn);
  }

  function renderPlan(plan, routeKey) {
    state.plan = plan;
    state.selected = -1;
    state.routeKey = routeKey || ('gen_' + plan.seed);

    // 有真实经纬度就走瓦片地图，否则用手绘抽象地图
    var hasGeo = plan.source === 'amap' && plan.nodes.length > 1 &&
      plan.nodes.every(function (n) {
        return typeof n.lng === 'number' && typeof n.lat === 'number' &&
               isFinite(n.lng) && isFinite(n.lat);
      });
    if (hasGeo) {
      mapScene = plan.scenes ? 'inter' : 'city';
      showTileMap(plan, mapScene);
      syncSceneButtons();
    } else {
      hideTileMap();
      drawMap(plan);
    }
    renderTimeline(plan);
    renderBudget(plan);
    renderEmptyDetail();

    var isReal = plan.source === 'amap';
    var spanText;
    if (plan.meta && plan.meta.calDays) {
      spanText = plan.meta.calDays + ' 天' +
                 (plan.meta.nights ? ' ' + plan.meta.nights + ' 晚' : '') + ' · ';
    } else {
      spanText = '全程约 ' + Math.round((plan.totalSpan || 0) / 60) + ' 小时 · ';
    }
    document.getElementById('mapMeta').textContent =
      plan.from + ' → ' + plan.to + ' · ' + plan.nodes.length + ' 个地点 · ' +
      spanText + (isReal ? '高德实时' : '模拟数据');
    document.getElementById('tlMeta').textContent =
      plan.duration + 'h 方案 · 合计 ' + yuan(plan.nodes.reduce(function (s, n) { return s + n.cost; }, 0));

    // 把生成规则写在明面上，避免「逻辑不明」
    var note = document.getElementById('routeNote');
    if (note) {
      if (isReal && plan.meta) {
        var approx = plan.meta.approxLegs || 0;
        if (plan.imported) {
          note.innerHTML = '<b>导入行程：</b>' +
            '① 站点、时间、费用均来自粘贴的行程文本，未做改动；' +
            '② 地点坐标由高德按地点名检索得到，段与段之间用高德实时路径补全折线' +
            (approx ? '（其中 ' + approx + ' 段为估算）' : '') + '；' +
            '③ 文中标注了车程/票价的段，时间与方式沿用原文，其余按距离自动判定；' +
            '④ 拖动时间轴卡片可调整顺序并重新规划。';
        } else {
          note.innerHTML = '<b>路线生成：</b>' +
          '① <b>路线导航</b>只生成 ' + esc(plan.from) + ' ⇄ ' + esc(plan.to) +
          ' 的去程与返程两个节点，地图「路线导航」视图只画两地之间的弧线；' +
          '② <b>景区漫游</b>以 ' + esc(plan.meta.hub || '车站') + ' 为锚点，' +
          '在 ' + (plan.meta.radiusKm ? plan.meta.radiusKm + ' 公里' : '市区') + '内取景点／餐饮／住宿，' +
          '每天一片区、片内最近邻，地图「景区漫游」视图聚焦目的地；' +
          '③ 段间按距离自动选择步行／骑行／公交地铁／驾车，取高德实时路径与用时' +
          (approx ? '（其中 ' + approx + ' 段降级为估算）' : '') + '；' +
          '④ 预算先从总额中扣除往返城际交通' +
          (plan.meta.interTotal ? '（约 ' + yuan(plan.meta.interTotal) + '）' : '') +
          '，余额再分配给住宿、餐饮与市内交通。';
        }
      } else {
        note.textContent = '模拟数据模式：地点、坐标与时间为随机生成，仅用于演示；真实地图与路径规划需切换到「真实数据」。';
      }
    }

    renderComments();
  }

  /* =========================================================
   * 8. 表单绑定
   * =======================================================*/
  var originEl = document.getElementById('origin');
  var destEl = document.getElementById('dest');
  var budgetEl = document.getElementById('budget');
  var budgetLabel = document.getElementById('budgetLabel');
  var duration = 48;

  function syncRange() {
    var min = +budgetEl.min, max = +budgetEl.max, v = +budgetEl.value;
    var p = ((v - min) / (max - min)) * 100;
    budgetEl.style.setProperty('--p', p + '%');
    budgetLabel.textContent = yuan(v);
  }
  budgetEl.addEventListener('input', syncRange);
  syncRange();

  document.getElementById('seg').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-hours]');
    if (!btn) return;
    duration = +btn.dataset.hours;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
      var on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  });

  /* --- 数据源切换：模拟 / 高德真实数据 --- */
  var currentSource = 'mock';
  var LS_SOURCE = 'jp.source.v1';

  function applySource(src, silent) {
    currentSource = (src === 'amap') ? 'amap' : 'mock';
    var seg = document.getElementById('srcSeg');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b.dataset.src === currentSource);
      b.setAttribute('aria-pressed', b.dataset.src === currentSource ? 'true' : 'false');
    });
    document.getElementById('keyField').hidden = currentSource !== 'amap';
    if (!silent) lsSet(LS_SOURCE, currentSource);
  }

  document.getElementById('srcSeg').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-src]');
    if (!btn) return;
    applySource(btn.dataset.src);
    if (currentSource === 'amap' && !amapKey()) toast('请先填写高德 Web 服务 Key');
  });

  var amapKeyEl = document.getElementById('amapKey');
  var keyStateEl = document.getElementById('keyState');
  var keyOnLoad = lsGet(LS_AMAP_KEY, '');
  if (keyOnLoad) {
    amapKeyEl.value = keyOnLoad;
    keyStateEl.textContent = '已保存';
  }
  amapKeyEl.addEventListener('input', function () {
    var v = this.value.trim();
    lsSet(LS_AMAP_KEY, v);
    keyStateEl.textContent = v ? '已保存' : '';
  });

  function currentInput() {
    return {
      from: originEl.value, to: destEl.value,
      budget: +budgetEl.value, duration: duration, mode: 'hub',
      fromHint: pickedPlace.origin, toHint: pickedPlace.dest
    };
  }

  var generateBtn = document.getElementById('generate');
  function setBusy(on) {
    generateBtn.disabled = !!on;
    generateBtn.textContent = on ? '规划中…' : '生成行程';
    generateBtn.style.opacity = on ? '0.72' : '';
    generateBtn.style.cursor = on ? 'progress' : '';
  }

  function generatePlan() {
    if (generateBtn.disabled) return;
    var input = currentInput();

    // 模拟数据：同步渲染
    if (currentSource !== 'amap') {
      renderPlan(buildMockPlan(input));
      return;
    }

    // 真实数据：异步请求，任何异常都回退到模拟数据，保证页面始终可用
    setBusy(true);
    fetchPlan(input).then(function (plan) {
      setBusy(false);
      renderPlan(plan, 'amap_' + plan.seed);
      var extra = plan.meta && plan.meta.distanceKm ? ' · 城际约 ' + plan.meta.distanceKm + ' 公里' : '';
      toast('已接入高德实时数据 · ' + plan.nodes.length + ' 个真实地点' + extra);
    }).catch(function (e) {
      setBusy(false);
      console.error('[amap]', e);
      toast(amapErrorText(e) + '，已回退模拟数据');
      renderPlan(buildMockPlan(input));
    });
  }

  // 恢复上次选择的数据源
  applySource(lsGet(LS_SOURCE, 'mock'), true);

  /* --- 底图图层切换（真实数据模式）：直接决定是否显示铁路/高速/注记 --- */
  var tileSegEl = document.getElementById('tileSeg');
  tileLtype = parseInt(lsGet(LS_LTYPE, 1), 10);
  if (![1, 3, 8, 0].some(function (v) { return v === tileLtype; })) tileLtype = 1;

  function applyTileLtype(v) {
    tileLtype = v;
    lsSet(LS_LTYPE, v);
    Array.prototype.forEach.call(tileSegEl.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', parseInt(b.dataset.ltype, 10) === v);
    });
    if (tileActive && tilePlan) {
      clearTiles();
      renderTiles();
    }
  }
  tileSegEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-ltype]');
    if (!btn) return;
    applyTileLtype(parseInt(btn.dataset.ltype, 10));
  });
  applyTileLtype(tileLtype);

  /* --- 城际 / 市内 视图切换（仅驻点漫游） --- */
  var sceneSwitchEl = document.getElementById('sceneSwitch');
  function syncSceneButtons() {
    Array.prototype.forEach.call(sceneSwitchEl.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b.dataset.scene === mapScene);
    });
  }
  sceneSwitchEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-scene]');
    if (!btn || !tileActive || !state.plan || !state.plan.scenes) return;
    mapScene = btn.dataset.scene;
    syncSceneButtons();
    showTileMap(state.plan, mapScene);
    toast(mapScene === 'inter' ? '路线导航视图' : '景区漫游视图');
  });

  /* --- 路线模式：已统一为「驻点漫游」（沿途漫游已移除） --- */
  document.getElementById('generate').addEventListener('click', generatePlan);

  // 输入框的回车已在联想组件里处理（有候选则选中，无候选则生成）

  /* =========================================================
   * 9. 提示 / 遮罩
   * =======================================================*/
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  var overlayEl = document.getElementById('overlay');
  function closeOverlay() {
    overlayEl.hidden = true;
    overlayEl.innerHTML = '';
  }
  function openImage(src) {
    overlayEl.innerHTML = '<img src="' + src + '" alt="评论图片">';
    overlayEl.hidden = false;
  }
  overlayEl.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-close]')) { closeOverlay(); return; }
    if (ev.target.closest('[data-select]')) {
      var inp = document.getElementById('shareInput');
      if (inp) { inp.focus(); inp.select(); }
      return;
    }
    if (ev.target.closest('[data-parse]')) {
      var tbox = document.getElementById('itinInput');
      runItineraryImport(tbox ? tbox.value : '');
      return;
    }
    if (ev.target === overlayEl) closeOverlay();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !overlayEl.hidden) closeOverlay();
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* =========================================================
   * 10. 本地存储层
   * =======================================================*/
  var LS_ROUTES = 'jp.routes.v1';
  var LS_COMMUNITY = 'jp.community.v1';
  var LS_COMMENTS = 'jp.comments.v1';

  function lsGet(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function lsSet(key, val) {
    try {
      window.localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) {
      toast('本地存储空间不足，本次改动未保存');
      return false;
    }
  }

  var store = {
    routes: lsGet(LS_ROUTES, []),
    community: lsGet(LS_COMMUNITY, []),
    comments: lsGet(LS_COMMENTS, {})
  };
  if (!Array.isArray(store.routes)) store.routes = [];
  if (!Array.isArray(store.community)) store.community = [];
  if (!store.comments || typeof store.comments !== 'object' || Array.isArray(store.comments)) store.comments = {};

  var uidSeq = 0;
  function uid(prefix) {
    uidSeq++;
    return prefix + Date.now().toString(36) + uidSeq.toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function fmtStamp(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
           ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function pickStatic(arr, i) { return arr[((i % arr.length) + arr.length) % arr.length]; }

  // 序列化为纯数据（丢弃渲染期挂上的 DOM 引用）
  function plainPlan(plan) {
    return {
      from: plan.from, to: plan.to, budget: plan.budget, duration: plan.duration,
      seed: plan.seed, allocated: plan.allocated, ratio: plan.ratio, totalSpan: plan.totalSpan,
      source: plan.source || 'mock',
      mode: 'hub',
      scenes: plan.scenes || null,
      meta: plan.meta || null,
      legs: plan.legs || null,
      nodes: plan.nodes.map(function (nd) {
        return {
          index: nd.index, kind: nd.kind, kindCode: nd.kindCode, typeLabel: nd.typeLabel,
          name: nd.name, icon: nd.icon, color: nd.color, weight: nd.weight, cost: nd.cost,
          start: nd.start, duration: nd.duration, end: nd.end, desc: nd.desc, tip: nd.tip,
          comments: nd.comments, x: nd.x, y: nd.y, day: nd.day, section: nd.section,
          descBase: nd.descBase,
          real: nd.real || null, refCost: nd.refCost || 0, lng: nd.lng, lat: nd.lat
        };
      })
    };
  }
  function clonePlan(plan) { return JSON.parse(JSON.stringify(plan)); }

  /* =========================================================
   * 11. 路线评论
   * =======================================================*/
  var cmListEl = document.getElementById('cmList');
  var cmUserEl = document.getElementById('cmUser');
  var cmTextEl = document.getElementById('cmText');
  var cmImageEl = document.getElementById('cmImage');
  var cmPreviewEl = document.getElementById('cmPreview');
  var cmPreviewImg = document.getElementById('cmPreviewImg');
  var pendingImage = null;

  function commentsOf(key) { return (key && store.comments[key]) ? store.comments[key] : []; }

  function routeLabel() {
    var p = state.plan;
    if (!p) return '—';
    var kind = (state.routeKey && state.routeKey.indexOf('gen_') === 0) ? '临时生成' : '已保存路线';
    return p.from + ' → ' + p.to + ' · ' + p.duration + 'h · ' + kind;
  }

  function renderComments() {
    document.getElementById('cmRouteMeta').textContent = routeLabel();

    var list = commentsOf(state.routeKey).slice().sort(function (a, b) { return b.ts - a.ts; });
    if (!list.length) {
      cmListEl.innerHTML = '<div class="empty-tip">这条路线还没有评论<br>写下第一条旅行记录吧 ✍️</div>';
    } else {
      cmListEl.innerHTML = list.map(function (c) {
        var user = c.user || '旅行者';
        var img = c.image ? '<img class="cm-thumb" src="' + c.image + '" alt="评论图片" data-zoom="1">' : '';
        return '<div class="cm-item" data-id="' + c.id + '">' +
                 '<div class="avatar">' + esc(user.slice(0, 2)) + '</div>' +
                 '<div class="cm-main">' +
                   '<div class="cm-row">' +
                     '<span class="cm-user">' + esc(user) + '</span>' +
                     '<span class="cm-time">' + fmtStamp(c.ts) + '</span>' +
                     '<button class="cm-del" type="button" data-del="' + c.id + '">删除</button>' +
                   '</div>' +
                   (c.text ? '<div class="cm-content">' + esc(c.text) + '</div>' : '') +
                   img +
                 '</div>' +
               '</div>';
      }).join('');
    }

    // 评论数变化时同步刷新路线卡片
    renderMyRoutes();
    renderCommunity();
  }

  cmListEl.addEventListener('click', function (ev) {
    var img = ev.target.closest('img[data-zoom]');
    if (img) { openImage(img.getAttribute('src')); return; }

    var del = ev.target.closest('button[data-del]');
    if (del) {
      var key = state.routeKey;
      store.comments[key] = commentsOf(key).filter(function (x) { return x.id !== del.getAttribute('data-del'); });
      lsSet(LS_COMMENTS, store.comments);
      renderComments();
      toast('评论已删除');
    }
  });

  // 图片：压缩后转 base64，避免撑爆 localStorage
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var src = e.target.result;
      var img = new Image();
      img.onload = function () {
        try {
          var MAX = 900;
          var w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            var s = Math.min(MAX / w, MAX / h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', 0.72));
        } catch (err) { cb(src); }
      };
      img.onerror = function () { cb(src); };
      img.src = src;
    };
    reader.onerror = function () { toast('图片读取失败，请重试'); };
    reader.readAsDataURL(file);
  }

  cmImageEl.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast('请选择图片文件'); this.value = ''; return; }
    compressImage(f, function (dataUrl) {
      pendingImage = dataUrl;
      cmPreviewImg.src = dataUrl;
      cmPreviewEl.hidden = false;
    });

  document.getElementById('cmPreviewDel').addEventListener('click', function () {

  function randomUser() {
    var pool = ['旅行者', '背包客', '路过的人', '赶路人', '自由行客'];
    return pool[Math.floor(Math.random() * pool.length)] + (Math.floor(Math.random() * 90) + 10);

  document.getElementById('cmSubmit').addEventListener('click', function () {

    cmTextEl.value = '';
    cmUserEl.value = '';
    pendingImage = null;
    cmPreviewImg.removeAttribute('src');

  /* =========================================================
   * 12. 我的路线：保存 / 加载 / 分享
   * =======================================================*/
  function saveCurrentRoute() {
    var p = state.plan;
    if (!p) { toast('还没有可保存的路线'); return; }

    var id = uid('r_');
    // 复制当前路线的评论到新 ID 下，实现「路线 + 评论」一起保存
    var cur = commentsOf(state.routeKey);
    if (cur.length) {
      store.comments[id] = cur.map(function (c) {
        return { id: uid('cm'), user: c.user, text: c.text, image: c.image, ts: c.ts };
      });

    store.routes.unshift({
      id: id, from: p.from, to: p.to, budget: p.budget, duration: p.duration,
      allocated: p.allocated, savedAt: Date.now(), plan: plainPlan(p)
    });

    state.routeKey = id;            // 沙盘切到刚保存的路线，后续评论归属它
    renderMyRoutes();
    renderCommunity();
    renderComments();

  function renderMyRoutes() {

        '<div class="rt-meta"><span>' + fmtStamp(r.savedAt) + ' 保存</span></div>' +
        '<div class="rt-actions">' +

        '</div>' +

    }).join('');
  }

  document.getElementById('myList').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('.rt-card');
    var rid = card.getAttribute('data-id');

    if (act === 'load') {

    } else if (act === 'share') {

  });

  function loadRoute(plan, key, msg) {
    renderPlan(plan, key);
    var panel = document.querySelector('.map-panel');
    if (panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (msg) toast(msg);

  /* =========================================================
   * 12.5 时间轴拖拽重排 + 重新规划
   *      （原先独立的「查看行程」面板已并入时间轴：
   *        每张卡片前面的「怎么过去」就是段信息，整组可横向拖动）
   * =======================================================*/
  function tlGroups() {
    return Array.prototype.slice.call(timelineEl.querySelectorAll('.tl-group'));
  }

  var tlDrag = null;

  function onTlMove(ev) {
    if (!tlDrag) return;
    if (!tlDrag.moved && Math.abs(ev.clientX - tlDrag.startX) < 5) return;
    if (!tlDrag.moved) {
      tlDrag.moved = true;
      timelineEl.classList.add('reordering');
    }
    var others = tlGroups().filter(function (x) { return x !== tlDrag.el; });
    var target = null;
    for (var i = 0; i < others.length; i++) {
      var r = others[i].getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { target = others[i]; break; }
    }
    if (target) timelineEl.insertBefore(tlDrag.el, target);
    else timelineEl.appendChild(tlDrag.el);
  }

  function onTlUp() {
    window.removeEventListener('pointermove', onTlMove);
    window.removeEventListener('pointerup', onTlUp);
    window.removeEventListener('pointercancel', onTlUp);
    if (!tlDrag) return;
    tlDrag.el.classList.remove('dragging');
    var moved = tlDrag.moved;
    tlDrag = null;
    timelineEl.classList.remove('reordering');
    if (moved) commitTlOrder();
  }

  timelineEl.addEventListener('pointerdown', function (ev) {
    if (tlDrag) return;
    if (ev.button !== undefined && ev.button !== 0) return;
    var group = ev.target.closest ? ev.target.closest('.tl-group') : null;
    if (!group) return;
    // 城际两端固定在「路线导航」段，不参与拖动
    var gi = +group.getAttribute('data-index');
    var gnd = state.plan && state.plan.nodes ? state.plan.nodes[gi] : null;
    if (gnd && gnd.section === 'inter') return;
    if (ev.preventDefault) ev.preventDefault();
    tlDrag = { el: group, startX: ev.clientX, moved: false };
    group.classList.add('dragging');
    window.addEventListener('pointermove', onTlMove);
    window.addEventListener('pointerup', onTlUp);
    window.addEventListener('pointercancel', onTlUp);
  });

  function commitTlOrder() {
    var plan = state.plan;
    if (!plan) return;
    var order = tlGroups().map(function (g) { return +g.getAttribute('data-index'); });
    var picked = order.map(function (i) { return plan.nodes[i]; });

    var nodes;
    if (plan.imported) {
      // 导入的行程没有严格的首尾城际节点，允许自由重排
      nodes = picked;
      if (!nodes.length) { renderTimeline(plan); return; }
    } else if (plan.scenes) {
      // 两段式：城际两端固定首尾，中间按时间轴上市内段的先后顺序重排
      var head = null, tail = null, mid = [];
      picked.forEach(function (nd) {
        if (nd.kindCode === 'transport-out') head = nd;
        else if (nd.kindCode === 'transport-back') tail = nd;
        else mid.push(nd);
      });
      if (!head || !tail) {
        toast('城际两端缺失，无法重排');
        renderTimeline(plan);
        return;
      }
      nodes = [head].concat(mid, [tail]);
    } else {
      nodes = picked;
      if (nodes[0].kindCode !== 'transport-out' || nodes[nodes.length - 1].kindCode !== 'transport-back') {
        toast('去程与返程需分别位于首尾，本次调整已取消');
        renderTimeline(plan);
        return;
      }
    }
    toast('正在按新顺序重新规划路线…');
    replanOrder(nodes).then(function (updated) {
      renderPlan(updated, state.routeKey);
      toast('已按新顺序重新规划（' + updated.nodes.length + ' 站）');
    }).catch(function (e) {
      console.error('[replan]', e);
      toast('重新规划失败，已还原原顺序');
      renderTimeline(plan);
    });
  }

  // 按新顺序重算各段路线与时间；固定首日 07:30 出发、每天 08:30 开始
  function replanOrder(ordered) {
    var plan = state.plan;
    var isReal = plan && plan.source === 'amap';
    var pairs = [];
    for (var i = 0; i < ordered.length - 1; i++) pairs.push([ordered[i], ordered[i + 1]]);

    var legPromise = isReal
      ? mapLimit(pairs, 2, function (p) {
          return amapLeg(p[0], p[1], plan && plan.meta ? plan.meta.cityAdcode : '');
        })
      : Promise.resolve(pairs.map(function () {
          return { mode: 'walking', minutes: 15, km: 1.2, polyline: [], approx: true };
        }));

    return legPromise.then(function (legs) {
      var cursor = 7 * 60 + 30, dayNo = 1, legsOut = [];
      var outDur = ordered[0].duration || 90;

      ordered.forEach(function (nd, i) {
        if (i === 0) {
          nd.start = cursor; nd.duration = outDur; nd.end = cursor + outDur;
          nd.day = 1; nd.legFromPrev = null; nd.index = 0;
          cursor = nd.end;
          return;
        }
        var leg = legs[i - 1];
        cursor += leg.minutes;
        legsOut.push(leg.polyline);
        nd.legFromPrev = leg;
        nd.index = i;
        if (nd.kind === 'lodging') {
          var nextMorning = dayNo * 1440 + (8 * 60 + 30);
          nd.duration = Math.max(360, nextMorning - cursor);
          nd.start = cursor; nd.end = cursor + nd.duration; nd.day = dayNo;
          cursor += nd.duration; dayNo += 1;
        } else {
          nd.start = cursor; nd.end = cursor + nd.duration; nd.day = dayNo;
          cursor += nd.duration;
        }
      });

      var updated = {};
      for (var k in plan) {
        if (Object.prototype.hasOwnProperty.call(plan, k)) updated[k] = plan[k];
      }
      updated.nodes = ordered;
      updated.legs = legsOut;
      updated.totalSpan = ordered[ordered.length - 1].end - (7 * 60 + 30);
      return updated;
    });
  }

  /* =========================================================
   * 13. 分享 / 导入：把路线编进链接本体，换台机器也能打开
   * =======================================================*/
  function b64enc(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64dec(str) {
    var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function r4(v) { return (typeof v === 'number' && isFinite(v)) ? Math.round(v * 1e4) / 1e4 : 0; }

  // 只编码重建路线所必需的字段；文案与评论在导入端按同一套规则重新生成
  function encodePlan(plan) {
    var payload = {
      v: 1,
      f: plan.from, t: plan.to, b: plan.budget, d: plan.duration,
      m: 'hub',
      s: plan.source || 'mock',
      n: plan.nodes.map(function (nd) {
        return [nd.name, nd.kindCode, r4(nd.lng), r4(nd.lat),
                nd.cost, nd.start, nd.duration, nd.day || 1, nd.section || 'city'];
      }),
      lg: plan.nodes.map(function (nd) {
        return nd.legFromPrev
          ? [nd.legFromPrev.mode, nd.legFromPrev.minutes, Math.round((nd.legFromPrev.km || 0) * 10) / 10]
          : null;
      }),
      l: (plan.legs || []).map(function (poly) {
        var p = poly || [];
        if (!p.length) return '';
        var step = Math.max(1, Math.ceil(p.length / 20));
        var out = [];
        for (var i = 0; i < p.length; i += step) out.push(r4(p[i].lng) + ',' + r4(p[i].lat));
        var last = p[p.length - 1];
        var tail = r4(last.lng) + ',' + r4(last.lat);
        if (out[out.length - 1] !== tail) out.push(tail);
        return out.join(';');
      }),
      meta: plan.meta || null
    };
    return b64enc(JSON.stringify(payload));
  }

  function kindFromCode(code) {
    if (code.indexOf('transport') === 0) return 'transport';
    return TYPE_META[code] ? code : 'attraction';
  }

  function decodePlan(str) {
    var payload = JSON.parse(b64dec(str));
    if (!payload || payload.v !== 1) throw new Error('BAD_VERSION');

    var seed = hashStr('import|' + str);
    var rng = mulberry32(seed);
    var ri = function (a, b) { return a + Math.floor(rng() * (b - a + 1)); };

    var nodes = (payload.n || []).map(function (row, i) {
      var kind = kindFromCode(String(row[1]));
      var meta = TYPE_META[kind];
      var dp = DESC_POOL[kind] || DESC_POOL.attraction;
      var tp = TIP_POOL[kind] || TIP_POOL.attraction;
      var nd = {
        index: i, kind: kind, kindCode: String(row[1]),
        typeLabel: row[1] === 'transport-out' ? '去程交通'
                 : row[1] === 'transport-back' ? '返程交通' : meta.label,
        name: String(row[0]), icon: meta.icon, color: meta.color, weight: WEIGHT[kind],
        lng: +row[2], lat: +row[3], cost: +row[4] || 0,
        start: +row[5] || 0, duration: +row[6] || 0,
        day: +row[7] || 1, section: row[8] || 'city',
        refCost: 0, real: null,
        descBase: dp[ri(0, dp.length - 1)], tip: tp[ri(0, tp.length - 1)]
      };
      nd.end = nd.start + nd.duration;
      nd.desc = nd.descBase;

      var cCount = ri(2, 3), used = {};
      nd.comments = [];
      for (var c = 0; c < cCount; c++) {
        var cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
        var guard = 0;
        while (used[cname] && guard++ < 20) cname = COMMENT_NAMES[ri(0, COMMENT_NAMES.length - 1)];
        used[cname] = 1;
        nd.comments.push({
          name: cname, rating: ri(4, 5),
          text: COMMENT_TEXTS[ri(0, COMMENT_TEXTS.length - 1)],
          date: '2024-' + pad2(ri(1, 12)) + '-' + pad2(ri(1, 28))
        });
      }
      return nd;
    });
    if (!nodes.length) throw new Error('EMPTY');

    var legs = (payload.l || []).map(function (s) {
      return String(s || '').split(';').filter(Boolean).map(function (pair) {
        var q = pair.split(',');
        return { lng: +q[0], lat: +q[1] };
      });
    });
    var lg = payload.lg || [];
    nodes.forEach(function (nd, i) {
      if (i === 0) { nd.legFromPrev = null; return; }
      var row = lg[i];
      nd.legFromPrev = row
        ? { mode: row[0], minutes: row[1], km: row[2], approx: true }
        : null;
    });

    var spent = nodes.reduce(function (s, n) { return s + n.cost; }, 0);
    var budget = +payload.b || 0;
    var lastIdx = nodes.length - 1;

    return {
      from: payload.f, to: payload.t, budget: budget, duration: +payload.d || 48,
      seed: seed, nodes: nodes, legs: legs,
      allocated: spent, ratio: budget ? spent / budget : 0.88,
      totalSpan: nodes[lastIdx].end - (7 * 60 + 30),
      source: payload.s || 'amap', mode: 'hub',
      scenes: [
        { id: 'inter', label: '路线导航', indices: [0, lastIdx] },
        { id: 'city',  label: '景区漫游', indices: citySceneIndices(lastIdx) }
      ],
      meta: payload.meta || null,
      imported: true
    };
  }

  function buildShareLink(plan) {
    var base = location.href.split('#')[0];
    return base + '#r=' + encodePlan(plan);
  }

  function doShare(plan, from, to) {
    if (!plan) { toast('还没有可分享的路线'); return; }
    var link;
    try { link = buildShareLink(plan); }
    catch (e) { console.error('[share]', e); toast('生成分享链接失败'); return; }

    copyText(link, function (ok) {
      if (ok) toast('分享链接已复制（' + link.length + ' 字符）· 换台设备也能打开');
      else showShareModal(link, from, to);
    });
  }

  function showShareModal(link, from, to) {
    overlayEl.innerHTML =
      '<div class="modal">' +
        '<h3>分享路线：' + esc(from) + ' → ' + esc(to) + '</h3>' +
        '<p>浏览器未允许自动复制，请手动复制下面的完整链接（已内嵌路线数据，换台设备也能打开）：</p>' +
        '<textarea id="shareInput" readonly rows="4"></textarea>' +
        '<div class="modal-actions">' +
          '<button class="mini-btn" data-select="1" type="button">全选</button>' +
          '<button class="mini-btn primary" data-close="1" type="button">知道了</button>' +
        '</div>' +
      '</div>';
    overlayEl.hidden = false;
    var inp = document.getElementById('shareInput');
    if (inp) { inp.value = link; inp.focus(); inp.select(); }
  }

  function extractPayload(text) {
    var s = String(text || '').trim();
    var m = /#r=([A-Za-z0-9\-_]+)/.exec(s);
    if (m) return m[1];
    if (/^[A-Za-z0-9\-_]{60,}$/.test(s)) return s;
    return '';
  }

  /* 载入别人的路线时，把「预算 / 行程时长 / 数据源」同步成该路线本身的值，
     否则面板还停在默认的 ¥1000 · 48h，与实际行程对不上 */
  function syncControlsFromPlan(plan) {
    var out = { budget: null, shownBudget: null, hours: null, days: 0 };
    if (!plan) return out;

    // 预算：滑杆只有 200~2000，超出范围时贴到端点，但保留原值用于提示
    var b = Math.round(plan.budget || 0);
    if (b > 0) {
      var min = +budgetEl.min || 200, max = +budgetEl.max || 2000;
      var step = +budgetEl.step || 50;
      var v = Math.round(Math.min(max, Math.max(min, b)) / step) * step;
      out.budget = b;
      out.shownBudget = v;
      budgetEl.value = String(v);
      syncRange();
    }

    // 行程时长：按实际跨度就近落到 24 / 48 / 72
    var days = (plan.meta && plan.meta.calDays)
      ? plan.meta.calDays
      : Math.max(1, Math.ceil((plan.totalSpan || 0) / 1440));
    out.days = days;
    var hours = days <= 1 ? 24 : days === 2 ? 48 : 72;
    out.hours = hours;
    duration = hours;
    var seg = document.getElementById('seg');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (btn) {
      var on = +btn.dataset.hours === hours;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    // 载入的是真实数据，数据源开关也对齐（只改界面，不写回本地偏好）
    if (plan.source === 'amap') applySource('amap', true);
    return out;
  }

  function syncToastText(synced) {
    if (!synced || !synced.hours) return '';
    var txt = '　·　已同步预算 ' + yuan(synced.shownBudget) + '、时长 ' + synced.hours + 'h';
    if (synced.budget && synced.budget !== synced.shownBudget) {
      txt += '（原方案 ' + yuan(synced.budget) + '，超出滑杆 ' +
             ('¥' + (+budgetEl.min)) + '~' + ('¥' + (+budgetEl.max)) + ' 范围）';
    }
    return txt;
  }

  function doImport(text) {
    var payload = extractPayload(text);
    if (!payload) { toast('没识别出分享编码，请把完整链接粘进来'); return false; }
    try {
      var plan = decodePlan(payload);
      closeOverlay();
      var synced = syncControlsFromPlan(plan);
      renderPlan(plan, 'imp_' + plan.seed);
      toast('已导入：' + plan.from + ' → ' + plan.to + ' · ' + plan.nodes.length + ' 站' +
            syncToastText(synced));
      return true;
    } catch (e) {
      console.error('[import]', e);
      toast('导入失败：链接已损坏或版本不兼容');
      return false;
    }
  }

  function shareRoute(id, from, to) {
    var all = store.routes.concat(store.community);
    var r = all.filter(function (x) { return x.id === id; })[0];
    if (!r) { toast('找不到这条路线'); return; }
    doShare(r.plan, r.from, r.to);
  }

  function copyText(text, cb) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { cb(true); },
          function () { cb(legacyCopy(text)); }
        );
        return;
      }
    } catch (e) { /* 继续走降级方案 */ }
    cb(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  /* =========================================================
   * 14. 社区路线（首次运行预置模拟数据）

  var COMMUNITY_SEED = [
